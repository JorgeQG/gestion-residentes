<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Residentes — Centro de Rehabilitación</title>
  <style>
/* ============================================================
   Centro de Rehabilitación — Sistema de Gestión de Residentes
   Hoja de estilos principal
   ============================================================ */

:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #1e293b;
  --text-soft: #64748b;
  --text-faint: #94a3b8;

  --primary: #1d6f5c;
  --primary-dark: #145243;
  --primary-soft: #e6f2ee;

  --accent: #2563eb;
  --accent-soft: #e6efff;

  --ok: #15803d;
  --ok-soft: #e7f6ec;
  --warn: #b45309;
  --warn-soft: #fdf3e3;
  --danger: #b91c1c;
  --danger-soft: #fdeaea;
  --info: #0e7490;
  --info-soft: #e2f4f7;
  --purple: #6d28d9;
  --purple-soft: #f0eafd;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .06);
  --shadow-lg: 0 10px 40px rgba(15, 23, 42, .18);
  --sidebar-w: 244px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}

[data-theme="dark"] {
  --bg: #0f1720;
  --surface: #172230;
  --surface-2: #1d2a3a;
  --border: #2a3a4d;
  --border-strong: #3b5068;
  --text: #e6edf5;
  --text-soft: #9fb0c4;
  --text-faint: #7488a0;

  --primary: #3fae90;
  --primary-dark: #2f8c73;
  --primary-soft: #16332c;

  --accent: #60a5fa;
  --accent-soft: #17263d;

  --ok: #4ade80;
  --ok-soft: #12301f;
  --warn: #fbbf24;
  --warn-soft: #33260d;
  --danger: #f87171;
  --danger-soft: #3a1919;
  --info: #38bdf8;
  --info-soft: #102c38;
  --purple: #a78bfa;
  --purple-soft: #241a3d;

  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }

/* ---------- Layout ---------- */

#app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 11px;
  align-items: center;
}

.brand-logo {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  display: grid;
  place-items: center;
}
.brand-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.brand-name { font-weight: 650; font-size: 14px; line-height: 1.25; }
.brand-sub { font-size: 11px; color: var(--text-faint); }

.nav { padding: 10px 10px; overflow-y: auto; flex: 1; }
.nav-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--text-faint);
  padding: 12px 10px 6px;
  font-weight: 650;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-soft);
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 2px;
  border: 0;
  background: none;
  width: 100%;
  text-align: left;
  font-size: 13.5px;
  font-family: inherit;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.nav-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 600; }
[data-theme="dark"] .nav-item.active { color: var(--primary); }
.nav-item .ico { width: 17px; text-align: center; font-size: 15px; flex: 0 0 17px; }
.nav-item .badge-count {
  margin-left: auto;
  background: var(--danger);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 999px;
}

.sidebar-foot {
  padding: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-botones { display: flex; gap: 8px; }

/* Ficha del usuario conectado */
.sesion-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  min-width: 0;
}
.sesion-chip:hover { border-color: var(--primary); }
.sesion-nombre {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sesion-rol { display: block; font-size: 11px; color: var(--text-faint); }

/* ---------- Pantalla de acceso ---------- */

#login-root {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--bg);
}
.login-caja {
  width: 100%;
  max-width: 390px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 28px 26px 24px;
}
.login-marca {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 18px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--border);
}
.login-marca img { width: 44px; height: 44px; object-fit: contain; flex: 0 0 44px; }
.login-centro { font-weight: 650; font-size: 14.5px; line-height: 1.25; }
.login-sub { font-size: 11.5px; color: var(--text-faint); }
.login-caja h2 { font-size: 17px; }
.login-texto { font-size: 12.5px; color: var(--text-soft); margin: 4px 0 18px; }
.login-error {
  margin-top: 14px;
  background: var(--danger-soft);
  border: 1px solid var(--border);
  border-left: 3px solid var(--danger);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 12.5px;
  color: var(--danger);
}
.login-pie {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-faint);
  line-height: 1.5;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 26px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.topbar h1 { font-size: 18px; }
.topbar .sub { font-size: 12.5px; color: var(--text-soft); margin-top: 1px; }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.view { padding: 22px 26px 60px; }

/* Botón hamburguesa y fondo del menú: solo visibles en pantallas pequeñas */
#btn-menu { display: none; }
#scrim {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .45);
  z-index: 55;
}
[hidden] { display: none !important; }

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 550;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(.92); background: var(--danger); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-soft); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 5px; }
.btn-icon { padding: 6px 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Cards ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-head h3 { font-size: 14.5px; }
.card-head .sub { font-size: 12px; color: var(--text-soft); }
.card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { padding: 16px 18px; }
.card-body.tight { padding: 0; }

/* ---------- Grid ---------- */

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }

@media (max-width: 1180px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-2-1, .g-1-2, .g3 { grid-template-columns: 1fr; }
}

/* ---------- Stat tiles ---------- */

.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 13px;
  align-items: flex-start;
}
.stat-ico {
  width: 38px; height: 38px; flex: 0 0 38px;
  border-radius: 9px;
  display: grid; place-items: center;
  font-size: 18px;
  background: var(--primary-soft);
}
.stat-val { font-size: 25px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.stat-lab { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
.stat-note { font-size: 11px; color: var(--text-faint); margin-top: 3px; }

/* Indicador pulsable: lleva a su sección ya filtrada */
a.stat-link, button.stat-link {
  cursor: pointer;
  color: inherit;
  text-align: left;
  font-family: inherit;
  width: 100%;
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.stat-link:hover {
  text-decoration: none;
  border-color: var(--primary);
  box-shadow: 0 2px 4px rgba(15, 23, 42, .06), 0 8px 20px rgba(15, 23, 42, .09);
}
.stat-link:active { transform: translateY(1px); }
.stat-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.stat-ir {
  margin-left: auto;
  align-self: center;
  font-size: 20px;
  color: var(--text-faint);
  opacity: 0;
  transition: opacity .12s, transform .12s;
}
.stat-link:hover .stat-ir { opacity: 1; transform: translateX(2px); }

/* ---------- Tables ---------- */

.table-wrap { overflow-x: auto; }
table.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.tbl th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-faint);
  font-weight: 650;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  white-space: nowrap;
}
table.tbl td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
table.tbl tbody tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl td.actions { text-align: right; white-space: nowrap; }
table.tbl .muted { color: var(--text-soft); }
.row-click { cursor: pointer; }

.empty {
  padding: 44px 20px;
  text-align: center;
  color: var(--text-faint);
}
.empty .big { font-size: 30px; margin-bottom: 8px; opacity: .55; }
.empty p { margin: 4px 0 14px; font-size: 13px; }

/* ---------- Badges / chips ---------- */

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.55;
  white-space: nowrap;
}
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-info { background: var(--info-soft); color: var(--info); }
.b-primary { background: var(--primary-soft); color: var(--primary-dark); }
[data-theme="dark"] .b-primary { color: var(--primary); }
.b-purple { background: var(--purple-soft); color: var(--purple); }
.b-gray { background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--border); }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* ---------- Forms ---------- */

.form-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 600; color: var(--text-soft); }
.field .help { font-size: 11px; color: var(--text-faint); }
.req { color: var(--danger); }

input[type="text"], input[type="date"], input[type="time"], input[type="number"],
input[type="search"], input[type="tel"], input[type="email"], input[type="password"],
select, textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
}
textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--primary); }
.check-row { display: flex; align-items: center; gap: 8px; padding-top: 21px; }
.check-row label { font-size: 13px; font-weight: 500; color: var(--text); }

/* Grupo de casillas para selección múltiple */
.checks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 11px 12px;
  background: var(--surface-2);
}
.checks .check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  padding: 3px 0;
  min-width: 0;
}
.checks .check span { min-width: 0; }
.checks .check:hover { color: var(--primary-dark); }
[data-theme="dark"] .checks .check:hover { color: var(--primary); }

/* Bloque plegable de campos opcionales en los formularios rápidos */
.detalles-opcionales {
  margin-top: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.detalles-opcionales > summary {
  cursor: pointer;
  padding: 10px 13px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-soft);
  list-style: none;
}
.detalles-opcionales > summary::-webkit-details-marker { display: none; }
.detalles-opcionales > summary::before { content: "▸ "; color: var(--text-faint); }
.detalles-opcionales[open] > summary::before { content: "▾ "; }
.detalles-opcionales > summary:hover { color: var(--text); }
.detalles-opcionales[open] > summary { border-bottom: 1px solid var(--border); }
.detalles-opcionales > .form-grid { padding: 14px 13px; }

.toolbar {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
.toolbar .search { position: relative; flex: 1 1 240px; max-width: 340px; }
.toolbar .search input { padding-left: 30px; }
.toolbar .search::before {
  content: "🔍";
  position: absolute;
  left: 9px; top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  opacity: .55;
}
.toolbar select, .toolbar input[type="date"] { width: auto; min-width: 130px; }
.toolbar .spacer { flex: 1; }

/* ---------- Modal ---------- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .5);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 100;
}
.modal {
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 620px;
  border: 1px solid var(--border);
  animation: pop .14s ease-out;
}
.modal.wide { max-width: 900px; }
.modal.narrow { max-width: 430px; }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.99); } }

.modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.modal-head h3 { font-size: 15.5px; }
.modal-head .sub { font-size: 12px; color: var(--text-soft); margin-top: 1px; }
.modal-body { padding: 20px; max-height: 66vh; overflow-y: auto; }
.modal-foot {
  padding: 13px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  background: var(--surface-2);
  border-radius: 0 0 12px 12px;
}
.modal-foot .left { margin-right: auto; }

/* ---------- Toast ---------- */

#toast-root {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  z-index: 200;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 8px;
  padding: 11px 16px;
  box-shadow: var(--shadow-lg);
  font-size: 13px;
  max-width: 360px;
  animation: slidein .18s ease-out;
}
.toast.err { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
@keyframes slidein { from { opacity: 0; transform: translateX(20px); } }

/* ---------- Misc pieces ---------- */

.section-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-faint);
  font-weight: 650;
  margin: 22px 0 10px;
}

.kv { display: grid; grid-template-columns: 150px 1fr; gap: 7px 14px; font-size: 13px; }
.kv dt { color: var(--text-soft); font-weight: 500; }
.kv dd { margin: 0; font-weight: 500; }

.avatar {
  width: 34px; height: 34px; flex: 0 0 34px;
  border-radius: 50%;
  background: var(--primary-soft);
  color: var(--primary-dark);
  display: grid; place-items: center;
  font-weight: 700; font-size: 12.5px;
}
[data-theme="dark"] .avatar { color: var(--primary); }
.avatar.lg { width: 58px; height: 58px; flex-basis: 58px; font-size: 20px; }
.acciones-rapidas { display: flex; gap: 7px; flex-wrap: wrap; }

.person { display: flex; align-items: center; gap: 10px; }
.person .nm { font-weight: 600; }
.person .mt { font-size: 11.5px; color: var(--text-faint); }

.timeline { position: relative; padding-left: 22px; }
.timeline::before {
  content: "";
  position: absolute;
  left: 5px; top: 4px; bottom: 4px;
  width: 2px;
  background: var(--border);
}
.tl-item { position: relative; padding-bottom: 16px; }
.tl-item::before {
  content: "";
  position: absolute;
  left: -21px; top: 5px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px var(--border);
}
.tl-item.warn::before { background: var(--warn); }
.tl-item.danger::before { background: var(--danger); }
.tl-item.info::before { background: var(--info); }
.tl-item.ok::before { background: var(--ok); }
.tl-date { font-size: 11.5px; color: var(--text-faint); font-weight: 600; }
.tl-body { font-size: 13px; margin-top: 2px; white-space: pre-wrap; }

/* Línea de tiempo de etapas del tratamiento */
.tl-etapas { position: relative; padding-left: 26px; }
.tl-etapas::before {
  content: "";
  position: absolute;
  left: 7px; top: 8px; bottom: 8px;
  width: 2px;
  background: var(--border);
}
.tl-etapa { position: relative; padding: 7px 0; display: flex; gap: 10px; }
.tl-punto {
  position: absolute;
  left: -25px; top: 12px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border-strong);
}
.tl-etapa.pasada .tl-punto { background: var(--primary); border-color: var(--primary); }
.tl-etapa.actual .tl-punto {
  background: var(--warn);
  border-color: var(--warn);
  box-shadow: 0 0 0 4px var(--warn-soft);
}
.tl-nombre { font-size: 13px; font-weight: 600; }
.tl-etapa.futura .tl-nombre { color: var(--text-faint); font-weight: 500; }
.tl-etapa.actual .tl-nombre { color: var(--primary-dark); }
[data-theme="dark"] .tl-etapa.actual .tl-nombre { color: var(--primary); }
.tl-detalle { font-size: 11.5px; color: var(--text-soft); }
.tl-etapa.futura .tl-detalle { color: var(--text-faint); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 42px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-track { background: var(--surface-2); border-radius: 999px; height: 9px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; background: var(--primary); border-radius: 999px; }
.bar-num { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }

.alert-item {
  display: flex;
  gap: 11px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.alert-item:last-child { border-bottom: 0; }
.alert-item .ai-ico { font-size: 16px; line-height: 1.3; flex: 0 0 auto; }
.alert-item .ai-c { flex: 1 1 0; min-width: 0; }
.alert-item .ai-t { font-weight: 600; font-size: 13px; }
.alert-item .ai-d { font-size: 12px; color: var(--text-soft); margin-top: 1px; }
.alert-item .ai-a { margin-left: auto; }

.tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab {
  padding: 9px 14px;
  border: 0;
  background: none;
  color: var(--text-soft);
  font-family: inherit;
  font-size: 13px;
  font-weight: 550;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); font-weight: 650; }
[data-theme="dark"] .tab.active { color: var(--primary); }

.note {
  background: var(--info-soft);
  border: 1px solid var(--border);
  border-left: 3px solid var(--info);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  font-size: 12.5px;
  color: var(--text);
}
.note.warn { background: var(--warn-soft); border-left-color: var(--warn); }
.note.danger { background: var(--danger-soft); border-left-color: var(--danger); }

.mono { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12px; }
.muted { color: var(--text-soft); }
.faint { color: var(--text-faint); }
.small { font-size: 12px; }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.pre { white-space: pre-wrap; }
.mt0 { margin-top: 0; }
.mb0 { margin-bottom: 0; }
.hidden { display: none !important; }

/* ---------- Reports ---------- */

.report {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 34px 40px;
  box-shadow: var(--shadow);
  max-width: 900px;
  margin: 0 auto;
}
.report h2 { font-size: 19px; margin-bottom: 2px; }
.rep-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 2px solid var(--primary);
  padding-bottom: 14px;
  margin-bottom: 20px;
  gap: 20px;
}
.rep-ident { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.rep-logo { width: 54px; height: 54px; flex: 0 0 54px; object-fit: contain; }
.rep-head .center-name { font-size: 12px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .07em; font-weight: 650; }
.rep-sec { margin-top: 24px; }
.rep-sec > h4 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--primary-dark);
  border-bottom: 1px solid var(--border);
  padding-bottom: 5px;
  margin-bottom: 11px;
}
[data-theme="dark"] .rep-sec > h4 { color: var(--primary); }
.rep-sign {
  margin-top: 52px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  text-align: center;
  font-size: 12px;
  color: var(--text-soft);
}
.rep-sign div { border-top: 1px solid var(--border-strong); padding-top: 7px; }
.rep-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.rep-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; }
.rep-stat .v { font-size: 20px; font-weight: 700; }
.rep-stat .l { font-size: 11px; color: var(--text-soft); }

/* ============================================================
   Adaptación a tablets y teléfonos
   ============================================================
   Se usa "screen" para que la impresión conserve siempre el
   diseño de escritorio (tablas como tablas, dos columnas, etc.).
   ============================================================ */

@media screen and (max-width: 980px) {
  .g2 { grid-template-columns: 1fr; }
  .report { padding: 26px 24px; }
}

/* ---------- Teléfonos y tablets en vertical ---------- */

@media screen and (max-width: 780px) {

  /* Menú lateral deslizante */
  #btn-menu { display: inline-flex; }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 60;
    height: 100vh;
    height: 100dvh;
    width: 262px;
    flex-basis: 262px;
    transform: translateX(-100%);
    transition: transform .22s ease;
  }
  .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
  .nav-item { padding: 11px 12px; font-size: 14.5px; }

  /* Cabecera */
  .topbar { padding: 10px 14px; gap: 10px; flex-wrap: wrap; }
  .topbar h1 { font-size: 16.5px; }
  .topbar .sub { font-size: 11.5px; }
  .topbar-actions { margin-left: 0; width: 100%; flex-wrap: wrap; }
  .topbar-actions .btn { flex: 1 1 auto; justify-content: center; }

  .view { padding: 14px 14px 56px; }

  /* Cuadrículas */
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid { gap: 12px; }

  /* Indicadores */
  .stat { padding: 12px 13px; gap: 10px; }
  .stat-ico { width: 32px; height: 32px; flex-basis: 32px; font-size: 16px; }
  .stat-val { font-size: 21px; }
  .stat-lab { font-size: 11.5px; }

  /* Tarjetas */
  .card-head { padding: 12px 14px; flex-wrap: wrap; }
  .card-head .right { margin-left: auto; }
  .card-body { padding: 14px; }

  /* Barra de filtros: buscador a lo ancho y filtros de a dos */
  .toolbar { gap: 8px; }
  .toolbar .search { flex: 1 1 100%; max-width: none; }
  .toolbar select,
  .toolbar input[type="date"] { flex: 1 1 calc(50% - 4px); min-width: 0; width: auto; }
  .toolbar .spacer { display: none; }
  .toolbar > .small { width: 100%; }

  /* Formularios: una sola columna */
  .form-grid > * { grid-column: span 12 !important; }
  .check-row { padding-top: 0; }

  /* Campos a 16 px: evita que iOS haga zoom al enfocarlos */
  input[type="text"], input[type="date"], input[type="time"], input[type="number"],
  input[type="search"], input[type="tel"], input[type="email"], input[type="password"],
  select, textarea {
    font-size: 16px;
    padding: 10px 11px;
  }

  /* Botones con área de toque cómoda */
  .btn { padding: 10px 14px; }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; }

  /* Modales a pantalla completa */
  .modal-backdrop { padding: 0; align-items: stretch; }
  .modal, .modal.wide, .modal.narrow {
    max-width: none;
    border-radius: 0;
    border: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .modal-body { max-height: none; flex: 1 1 auto; padding: 16px 14px; }
  .modal-head { padding: 14px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .modal-foot {
    border-radius: 0;
    padding: 12px 14px;
    flex-wrap: wrap;
    position: sticky;
    bottom: 0;
  }
  .modal-foot .left { width: 100%; margin: 0 0 8px; }
  .modal-foot > .btn { flex: 1 1 0; justify-content: center; }

  /* Listas de descripción apiladas */
  .kv { grid-template-columns: 1fr; gap: 0; }
  .kv dt {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-faint);
    margin-top: 10px;
  }
  .kv dt:first-child { margin-top: 0; }

  /* Gráficos de barras */
  .bar-row { grid-template-columns: 96px 1fr 32px; gap: 8px; font-size: 12px; }

  /* Alertas: el botón pasa debajo del texto */
  .alert-item { flex-wrap: wrap; }
  .alert-item .ai-a { width: 100%; margin-left: 0; padding-left: 27px; margin-top: 6px; }

  /* Acciones rápidas de la ficha: a lo ancho de la tarjeta */
  .acciones-rapidas { width: 100%; }
  .acciones-rapidas .btn { flex: 1 1 calc(50% - 4px); justify-content: center; }

  /* Pestañas desplazables */
  .tabs { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }

  /* Avisos */
  #toast-root { left: 14px; right: 14px; bottom: 14px; }
  .toast { max-width: none; }

  /* Informes */
  .report { padding: 18px 15px; }
  .report h2 { font-size: 17px; }
  .rep-head { flex-direction: column; gap: 12px; }
  .rep-head .right { text-align: left; }
  .rep-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .rep-sign { grid-template-columns: 1fr; gap: 30px; margin-top: 38px; }
  .rep-sec > div[style*="grid-template-columns"] { display: block !important; }
  .rep-sec > div[style*="grid-template-columns"] > div + div { margin-top: 18px; }
}

/* ---------- Tablas convertidas en tarjetas ---------- */

@media screen and (max-width: 720px) {
  .table-wrap { overflow-x: visible; }

  table.tbl,
  table.tbl tbody,
  table.tbl tr,
  table.tbl td { display: block; width: 100%; }

  table.tbl thead { display: none; }

  table.tbl tr {
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
  }
  table.tbl tbody tr:last-child { border-bottom: 0; }

  /* La primera celda actúa como título de la tarjeta */
  table.tbl tr > td:first-child {
    padding: 0 0 8px;
    margin-bottom: 7px;
    border-bottom: 1px dashed var(--border);
    font-weight: 600;
  }
  table.tbl tr > td:first-child::before { display: none; }

  /* La etiqueta de la columna se posiciona a la izquierda de forma
     absoluta para no alterar el contenido de la celda, que puede
     tener varias líneas o elementos. */
  table.tbl td {
    position: relative;
    border: 0;
    padding: 5px 0 5px 40%;
    min-height: 26px;
  }
  table.tbl td::before {
    content: attr(data-l);
    position: absolute;
    left: 0;
    top: 6px;
    width: 37%;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-faint);
    font-weight: 650;
    line-height: 1.35;
  }

  /* Columna de acciones (sin título): ocupa todo el ancho, abajo */
  table.tbl td[data-l=""] {
    padding: 10px 0 0;
    text-align: left;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    white-space: normal;
  }
  table.tbl td[data-l=""]::before { display: none; }
  table.tbl td.actions { text-align: left; white-space: normal; }

  /* En formato tarjeta el contenido puede ocupar varias líneas */
  table.tbl td.nowrap { white-space: normal; }
}

/* ---------- Teléfonos pequeños ---------- */

@media screen and (max-width: 430px) {
  .g3 { grid-template-columns: 1fr; }
  .stat { padding: 11px 11px; gap: 9px; }
  .stat-ico { width: 28px; height: 28px; flex-basis: 28px; font-size: 14px; }
  .stat-val { font-size: 19px; }
  .stat-lab { font-size: 11px; line-height: 1.35; }
  .stat-note { font-size: 10.5px; }
  .rep-stat .v { font-size: 17px; }
  table.tbl td { padding-left: 46%; }
  table.tbl td::before { width: 43%; }
  .bar-row { grid-template-columns: 84px 1fr 30px; }
}

@media print {

  body { background: #fff; }

  .rep-sec { break-inside: avoid; }
  table.tbl th { background: #f0f0f0 !important; }
  .badge { border: 1px solid #999; }
}
