/* ============================================================
   utils.js — utilidades generales, formularios, modales, toasts
   ============================================================ */

const U = {

  /* ---------- ids y fechas ---------- */

  uid(prefix) {
    return (prefix || 'id') + '_' +
      Date.now().toString(36) + '_' +
      Math.random().toString(36).slice(2, 8);
  },

  /** Fecha de hoy en formato ISO local (YYYY-MM-DD), sin desfase de zona horaria. */
  hoy() {
    return U.toISO(new Date());
  },

  toISO(d) {
    const x = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return x.toISOString().slice(0, 10);
  },

  ahora() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  },

  /** "2025-03-08" -> "08-03-2025" */
  fecha(iso) {
    if (!iso) return '—';
    const p = String(iso).slice(0, 10).split('-');
    if (p.length !== 3) return iso;
    return `${p[2]}-${p[1]}-${p[0]}`;
  },

  /** "2025-03-08" -> "8 de marzo de 2025" */
  fechaLarga(iso) {
    if (!iso) return '—';
    const d = U.parse(iso);
    if (!d) return iso;
    return `${d.getDate()} de ${U.MESES[d.getMonth()]} de ${d.getFullYear()}`;
  },

  fechaHora(iso, hora) {
    if (!iso) return '—';
    return U.fecha(iso) + (hora ? ' · ' + hora : '');
  },

  parse(iso) {
    if (!iso) return null;
    const p = String(iso).slice(0, 10).split('-').map(Number);
    if (p.length !== 3 || p.some(isNaN)) return null;
    return new Date(p[0], p[1] - 1, p[2]);
  },

  /** Días transcurridos entre dos fechas ISO (b - a). */
  dias(a, b) {
    const da = U.parse(a), db = U.parse(b || U.hoy());
    if (!da || !db) return 0;
    return Math.round((db - da) / 86400000);
  },

  /** Suma días a una fecha ISO. */
  sumaDias(iso, n) {
    const d = U.parse(iso);
    if (!d) return iso;
    d.setDate(d.getDate() + n);
    return U.toISO(d);
  },

  edad(fechaNac) {
    const d = U.parse(fechaNac);
    if (!d) return null;
    const h = new Date();
    let a = h.getFullYear() - d.getFullYear();
    const m = h.getMonth() - d.getMonth();
    if (m < 0 || (m === 0 && h.getDate() < d.getDate())) a--;
    return a >= 0 && a < 130 ? a : null;
  },

  /** Rango [desde, hasta] de la semana (lunes-domingo) que contiene la fecha dada. */
  semanaDe(iso) {
    const d = U.parse(iso) || new Date();
    const dow = (d.getDay() + 6) % 7; // lunes = 0
    const ini = new Date(d); ini.setDate(d.getDate() - dow);
    const fin = new Date(ini); fin.setDate(ini.getDate() + 6);
    return [U.toISO(ini), U.toISO(fin)];
  },

  /** Rango [desde, hasta] del mes "YYYY-MM". */
  mesDe(ym) {
    const [y, m] = String(ym).split('-').map(Number);
    const ini = new Date(y, m - 1, 1);
    const fin = new Date(y, m, 0);
    return [U.toISO(ini), U.toISO(fin)];
  },

  mesActual() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  },

  nombreMes(ym) {
    const [y, m] = String(ym).split('-').map(Number);
    return `${U.MESES[m - 1]} de ${y}`;
  },

  enRango(iso, desde, hasta) {
    if (!iso) return false;
    const f = String(iso).slice(0, 10);
    return (!desde || f >= desde) && (!hasta || f <= hasta);
  },

  MESES: ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
    'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'],

  /* ---------- texto ---------- */

  esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  /** Texto con saltos de línea preservados y escapado. */
  nl(s) {
    return U.esc(s).replace(/\n/g, '<br>');
  },

  corta(s, n) {
    s = String(s || '');
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  },

  iniciales(nombre) {
    const p = String(nombre || '?').trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
  },

  /** Normaliza para búsquedas: minúsculas y sin acentos. */
  norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  },

  plural(n, sing, plu) {
    return n === 1 ? `1 ${sing}` : `${n} ${plu}`;
  },

  /* ---------- ordenar / agrupar ---------- */

  porFechaDesc(campo) {
    campo = campo || 'fecha';
    return (a, b) => String(b[campo] || '').localeCompare(String(a[campo] || '')) ||
      String(b.creado || '').localeCompare(String(a.creado || ''));
  },

  agrupar(arr, fn) {
    const m = {};
    arr.forEach(x => {
      const k = fn(x);
      (m[k] = m[k] || []).push(x);
    });
    return m;
  },

  contar(arr, fn) {
    const m = {};
    arr.forEach(x => { const k = fn(x); m[k] = (m[k] || 0) + 1; });
    return m;
  },

  suma(arr, fn) {
    return arr.reduce((t, x) => t + (Number(fn ? fn(x) : x) || 0), 0);
  },

  /* ---------- descarga de archivos ---------- */

  descargar(nombre, contenido, mime) {
    const blob = new Blob([contenido], { type: mime || 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },

  /** Convierte filas a CSV con separador ";" (compatible con Excel en español). */
  csv(cols, rows) {
    const q = v => {
      const s = v === null || v === undefined ? '' : String(v);
      return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const out = [cols.map(c => q(c.l)).join(';')];
    rows.forEach(r => out.push(cols.map(c => q(c.v(r))).join(';')));
    return '﻿' + out.join('\r\n');
  }
};


/* ============================================================
   UI — componentes de interfaz reutilizables
   ============================================================ */

const UI = {

  /* ---------- toasts ---------- */

  toast(msg, tipo) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast' + (tipo ? ' ' + tipo : '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 260);
    }, 3200);
  },

  /* ---------- modales ---------- */

  _stack: [],

  /**
   * opts: { title, sub, body, size, submit, cancel, extraFoot, onSubmit(datos, form), onOpen(modalEl) }
   * onSubmit devuelve false para mantener el modal abierto.
   */
  modal(opts) {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <form class="modal ${opts.size || ''}" novalidate>
        <div class="modal-head">
          <div>
            <h3>${U.esc(opts.title || '')}</h3>
            ${opts.sub ? `<div class="sub">${U.esc(opts.sub)}</div>` : ''}
          </div>
          <button type="button" class="btn btn-ghost btn-icon" style="margin-left:auto" data-close>✕</button>
        </div>
        <div class="modal-body">${opts.body || ''}</div>
        <div class="modal-foot">
          ${opts.extraFoot ? `<div class="left">${opts.extraFoot}</div>` : ''}
          <button type="button" class="btn" data-close>${U.esc(opts.cancel || 'Cancelar')}</button>
          ${opts.submit === null ? '' :
            `<button type="submit" class="btn btn-primary">${U.esc(opts.submit || 'Guardar')}</button>`}
        </div>
      </form>`;

    const cerrar = () => {
      back.remove();
      UI._stack = UI._stack.filter(x => x !== back);
      if (!UI._stack.length) document.body.style.overflow = '';
    };

    back.addEventListener('click', e => {
      if (e.target === back || e.target.closest('[data-close]')) cerrar();
    });

    const form = back.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!UI.valida(form)) return;
      const datos = UI.datos(form);
      const r = opts.onSubmit ? opts.onSubmit(datos, form) : true;
      if (r !== false) cerrar();
    });

    document.getElementById('modal-root').appendChild(back);
    document.body.style.overflow = 'hidden';
    UI._stack.push(back);

    const primero = back.querySelector('input:not([type=hidden]), select, textarea');
    if (primero) setTimeout(() => primero.focus(), 30);
    if (opts.onOpen) opts.onOpen(back);

    back._cerrar = cerrar;
    return back;
  },

  confirmar(opts) {
    return UI.modal({
      title: opts.title || '¿Confirmar?',
      size: 'narrow',
      body: `<div style="font-size:13.5px;line-height:1.6">${opts.body || ''}</div>`,
      submit: opts.submit || 'Confirmar',
      onSubmit: () => { opts.onSubmit(); },
      onOpen: back => {
        if (opts.peligro) back.querySelector('button[type=submit]').className = 'btn btn-danger';
      }
    });
  },

  /* ---------- formularios ---------- */

  /**
   * Renderiza campos. Cada campo:
   * { n:nombre, l:etiqueta, t:tipo, w:ancho(1-12), req, opts:[], ph, rows, min, max, step, help, val }
   * Tipos: text, textarea, date, time, number, select, checkbox, tel, hidden, sep, html
   */
  campos(defs, valores) {
    valores = valores || {};
    return `<div class="form-grid">` + defs.map(f => {
      if (f.t === 'sep') {
        return `<div style="grid-column:span 12"><div class="section-title" style="margin:6px 0 0">${U.esc(f.l)}</div></div>`;
      }
      if (f.t === 'html') {
        return `<div style="grid-column:span ${f.w || 12}">${f.html}</div>`;
      }
      const v = valores[f.n] !== undefined && valores[f.n] !== null ? valores[f.n] : (f.val !== undefined ? f.val : '');
      const w = f.w || 12;
      const req = f.req ? ' data-req="1"' : '';
      let ctrl;

      if (f.t === 'hidden') {
        return `<input type="hidden" name="${f.n}" value="${U.esc(v)}">`;
      }
      if (f.t === 'select') {
        ctrl = `<select name="${f.n}"${req}>
          ${f.vacio === false ? '' : `<option value="">${U.esc(f.ph || '— Seleccionar —')}</option>`}
          ${(f.opts || []).map(o => {
            const val = typeof o === 'object' ? o.v : o;
            const lab = typeof o === 'object' ? o.l : o;
            return `<option value="${U.esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${U.esc(lab)}</option>`;
          }).join('')}
        </select>`;
      } else if (f.t === 'textarea') {
        ctrl = `<textarea name="${f.n}" rows="${f.rows || 3}" placeholder="${U.esc(f.ph || '')}"${req}>${U.esc(v)}</textarea>`;
      } else if (f.t === 'checkbox') {
        return `<div class="field check-row" style="grid-column:span ${w}">
          <input type="checkbox" name="${f.n}" id="f_${f.n}" value="1"${v ? ' checked' : ''}>
          <label for="f_${f.n}">${U.esc(f.l)}</label>
        </div>`;
      } else if (f.t === 'checks') {
        // Selección múltiple: el valor se recoge como arreglo.
        const sel = Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
        return `<div class="field" style="grid-column:span ${w}">
          <label>${U.esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>
          <div class="checks">
            ${(f.opts || []).map((o, i) => {
              const val = typeof o === 'object' ? o.v : o;
              const lab = typeof o === 'object' ? o.l : o;
              return `<label class="check">
                <input type="checkbox" name="${f.n}" data-multi="1" value="${U.esc(val)}"
                  ${sel.includes(String(val)) ? ' checked' : ''}>
                <span>${U.esc(lab)}</span>
              </label>`;
            }).join('')}
          </div>
          ${f.help ? `<div class="help">${U.esc(f.help)}</div>` : ''}
        </div>`;
      } else {
        const extra = [
          f.min !== undefined ? `min="${f.min}"` : '',
          f.max !== undefined ? `max="${f.max}"` : '',
          f.step !== undefined ? `step="${f.step}"` : ''
        ].join(' ');
        ctrl = `<input type="${f.t || 'text'}" name="${f.n}" value="${U.esc(v)}"
                 placeholder="${U.esc(f.ph || '')}" ${extra}${req}>`;
      }

      return `<div class="field" style="grid-column:span ${w}">
        <label>${U.esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>
        ${ctrl}
        ${f.help ? `<div class="help">${U.esc(f.help)}</div>` : ''}
      </div>`;
    }).join('') + `</div>`;
  },

  /** Extrae los valores de un formulario como objeto plano. */
  datos(form) {
    const o = {};
    form.querySelectorAll('input, select, textarea').forEach(el => {
      if (!el.name) return;
      if (el.type === 'checkbox') {
        if (el.dataset.multi) {
          // Varias casillas comparten el nombre: se acumulan en un arreglo.
          if (!Array.isArray(o[el.name])) o[el.name] = [];
          if (el.checked) o[el.name].push(el.value);
        } else {
          o[el.name] = el.checked;
        }
      } else {
        o[el.name] = typeof el.value === 'string' ? el.value.trim() : el.value;
      }
    });
    return o;
  },

  /** Validación de campos marcados data-req. */
  valida(form) {
    let ok = true, primero = null;
    form.querySelectorAll('[data-req]').forEach(el => {
      const vacio = !String(el.value || '').trim();
      el.style.borderColor = vacio ? 'var(--danger)' : '';
      if (vacio) { ok = false; primero = primero || el; }
    });
    if (!ok) {
      UI.toast('Complete los campos obligatorios marcados con *', 'err');
      if (primero) primero.focus();
    }
    return ok;
  },

  /* ---------- tablas ---------- */

  /**
   * cols: [{ l:'Título', c:(fila)=>html, cls:'' }]
   * opts: { vacio:{ico,titulo,texto,accion}, click:(fila)=>void via data-attrs }
   */
  tabla(cols, filas, opts) {
    opts = opts || {};
    if (!filas.length) return UI.vacio(opts.vacio || {});
    // data-l lleva el título de la columna: en pantallas pequeñas la hoja de
    // estilos convierte cada fila en una tarjeta y lo usa como etiqueta.
    return `<div class="table-wrap"><table class="tbl">
      <thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${U.esc(c.l)}</th>`).join('')}</tr></thead>
      <tbody>${filas.map(f => {
        const attrs = opts.filaAttrs ? opts.filaAttrs(f) : '';
        return `<tr ${attrs}>${cols.map(c =>
          `<td class="${c.cls || ''}" data-l="${U.esc(c.l)}">${c.c(f)}</td>`).join('')}</tr>`;
      }).join('')}</tbody>
    </table></div>`;
  },

  vacio(o) {
    return `<div class="empty">
      <div class="big">${o.ico || '📋'}</div>
      <div style="font-weight:600;color:var(--text-soft)">${U.esc(o.titulo || 'Sin registros')}</div>
      <p>${U.esc(o.texto || 'Todavía no hay información en esta sección.')}</p>
      ${o.accion || ''}
    </div>`;
  },

  /**
   * Indicador. Con `href` o `accion` se vuelve pulsable y lleva a la sección
   * correspondiente; sin ellos es solo informativo.
   */
  stat(o) {
    const interior = `
      <div class="stat-ico" style="${o.color ? `background:${o.color}` : ''}">${o.ico || '•'}</div>
      <div style="min-width:0">
        <div class="stat-val">${o.val}</div>
        <div class="stat-lab">${U.esc(o.lab)}</div>
        ${o.nota ? `<div class="stat-note">${U.esc(o.nota)}</div>` : ''}
      </div>
      ${o.href || o.accion ? '<span class="stat-ir" aria-hidden="true">›</span>' : ''}`;

    const titulo = o.titulo ? ` title="${U.esc(o.titulo)}"` : '';
    if (o.href) return `<a class="stat stat-link" href="${o.href}"${titulo}>${interior}</a>`;
    if (o.accion) return `<button type="button" class="stat stat-link" data-action="${o.accion}"${titulo}>${interior}</button>`;
    return `<div class="stat">${interior}</div>`;
  },

  barras(items, total) {
    const max = Math.max(total || 0, ...items.map(i => i.v), 1);
    if (!items.length) return `<div class="faint small">Sin datos.</div>`;
    return `<div class="bars">${items.map(i => {
      const etiqueta = U.esc(U.corta(i.l, 20));
      return `<div class="bar-row">
        <div class="nowrap" title="${U.esc(i.l)}">${i.href ? `<a href="${i.href}">${etiqueta}</a>` : etiqueta}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(i.v / max * 100).toFixed(1)}%;${i.color ? `background:${i.color}` : ''}"></div></div>
        <div class="bar-num">${i.v}</div>
      </div>`;
    }).join('')}</div>`;
  },

  persona(r, opts) {
    opts = opts || {};
    return `<div class="person">
      <div class="avatar${opts.lg ? ' lg' : ''}">${U.esc(U.iniciales(r.nombre))}</div>
      <div style="min-width:0">
        <div class="nm">${U.esc(r.nombre || 'Sin nombre')}</div>
        <div class="mt">${U.esc(opts.meta || r.documento || '')}</div>
      </div>
    </div>`;
  }
};


/* ===== db.js ===== */
/* ============================================================
   db.js — almacenamiento local, catálogos y consultas derivadas
   ============================================================
   Los datos se guardan en localStorage del navegador. No salen
   del equipo. Use Configuración → Respaldo para exportar copias.
   ============================================================ */

const DB = (() => {

  const CLAVE = 'crc_gestion_residentes_v1';

  const CONFIG_DEF = {
    centro: 'Centro de Rehabilitación',
    lema: 'Sistema de Gestión de Residentes',
    responsable: '',
    maxLlamadasDia: 2,
    brigadas: [
      'Sargento', 'Quincho', 'Cap de Cocina', 'Ayudante Cocina', 'Exterior',
      'Contorno', 'Liviano Pesado', 'Mantención', 'Baños', 'Panadería',
      'Ayudante de Panadería', 'Recolector Basura', 'Living Comedor Pasillo',
      'Lavandería', 'Animales', 'Pool Entrada', 'Huerto', 'Leña'
    ],
    /* Brigadas que no tienen un encargado individual sino un grupo del centro. */
    brigadasColectivas: {
      'Exterior': 'Niveles',
      'Huerto': 'Niveles',
      'Leña': 'Niveles'
    },
    /* Catálogos editables desde Configuración */
    tiposFalta: [
      'Incumplimiento de horario',
      'Incumplimiento de tareas',
      'Falta de respeto a compañero',
      'Falta de respeto a personal',
      'Agresión verbal',
      'Agresión física',
      'Consumo o sospecha de consumo',
      'Ingreso de sustancias u objetos prohibidos',
      'Salida no autorizada',
      'Uso indebido de teléfono',
      'Daño a bienes del centro',
      'Incidente de salud / accidente',
      'Otro'
    ],
    medidas: [
      'Llamado de atención verbal',
      'Amonestación escrita',
      'Reflexión escrita',
      'Trabajo comunitario adicional',
      'Suspensión de salidas',
      'Suspensión de llamadas',
      'Retroceso de etapa',
      'Evaluación por equipo técnico',
      'Egreso disciplinario',
      'Sin medida (registro informativo)'
    ],
    /* Alertas ya atendidas: { clave: fecha en que se marcó } */
    alertasVistas: {},
    tema: 'light'
  };

  const vacio = () => ({
    version: 1,
    config: JSON.parse(JSON.stringify(CONFIG_DEF)),
    residentes: [],
    conductas: [],
    salidas: [],
    llamadas: [],
    tareas: [],
    usuarios: [],
    etapas: []
  });

  let estado = vacio();
  let disponible = true;

  /* ---------- persistencia ---------- */

  function cargar() {
    try {
      const raw = localStorage.getItem(CLAVE);
      if (raw) {
        const d = JSON.parse(raw);
        estado = Object.assign(vacio(), d);
        estado.config = Object.assign({}, CONFIG_DEF, d.config || {});
      }
    } catch (e) {
      disponible = false;
      console.warn('No se pudo leer el almacenamiento local:', e);
    }
  }

  let avisoDado = false;

  function guardar() {
    try {
      localStorage.setItem(CLAVE, JSON.stringify(estado));
      return true;
    } catch (e) {
      disponible = false;
      // El aviso se muestra una sola vez para no saturar la pantalla.
      if (!avisoDado) {
        avisoDado = true;
        console.error(e);
        if (typeof UI !== 'undefined') {
          UI.toast('Este navegador no permite guardar datos. Los cambios se perderán al cerrar: exporte un respaldo.', 'err');
        }
      }
      return false;
    }
  }

  cargar();

  /* ---------- CRUD genérico ---------- */

  const api = {

    get config() { return estado.config; },
    get almacenamientoOK() { return disponible; },

    guardarConfig(patch) {
      Object.assign(estado.config, patch);
      guardar();
    },

    todos(col) {
      return (estado[col] || []).slice();
    },

    obtener(col, id) {
      return (estado[col] || []).find(x => x.id === id) || null;
    },

    /** Devuelve los registros de una colección asociados a un residente. */
    de(col, residenteId) {
      return (estado[col] || []).filter(x => x.residenteId === residenteId);
    },

    crear(col, obj) {
      const item = Object.assign({}, obj, {
        id: obj.id || U.uid(col.slice(0, 3)),
        creado: new Date().toISOString()
      });
      estado[col].push(item);
      guardar();
      return item;
    },

    actualizar(col, id, patch) {
      const i = estado[col].findIndex(x => x.id === id);
      if (i < 0) return null;
      estado[col][i] = Object.assign({}, estado[col][i], patch, {
        modificado: new Date().toISOString()
      });
      guardar();
      return estado[col][i];
    },

    eliminar(col, id) {
      const n = estado[col].length;
      estado[col] = estado[col].filter(x => x.id !== id);
      // Al eliminar un residente se eliminan sus registros asociados.
      if (col === 'residentes') {
        ['etapas', 'conductas', 'salidas', 'llamadas', 'tareas'].forEach(c => {
          estado[c] = estado[c].filter(x => x.residenteId !== id);
        });
      }
      guardar();
      return estado[col].length < n;
    },

    /* ---------- respaldo ---------- */

    exportar() {
      return JSON.stringify(estado, null, 2);
    },

    importar(json, modo) {
      const d = JSON.parse(json);
      if (!d || !Array.isArray(d.residentes)) throw new Error('El archivo no tiene el formato esperado.');
      if (modo === 'fusionar') {
        ['residentes', 'etapas', 'conductas', 'salidas', 'llamadas', 'tareas'].forEach(c => {
          const existentes = new Set(estado[c].map(x => x.id));
          (d[c] || []).forEach(x => { if (!existentes.has(x.id)) estado[c].push(x); });
        });
      } else {
        estado = Object.assign(vacio(), d);
        estado.config = Object.assign({}, CONFIG_DEF, d.config || {});
      }
      guardar();
    },

    borrarTodo() {
      estado = vacio();
      guardar();
    },

    resumenVolumen() {
      return {
        residentes: estado.residentes.length,
        etapas: estado.etapas.length,
        conductas: estado.conductas.length,
        salidas: estado.salidas.length,
        llamadas: estado.llamadas.length,
        tareas: estado.tareas.length
      };
    },

    /* ---------- consultas de dominio ---------- */

    residente(id) { return api.obtener('residentes', id); },

    nombreDe(id) {
      const r = api.residente(id);
      return r ? r.nombre : 'Residente eliminado';
    },

    /** Residentes no egresados. */
    activos() {
      return api.todos('residentes').filter(r => r.estado !== 'Egresado');
    },

    egresados() {
      return api.todos('residentes').filter(r => r.estado === 'Egresado');
    },

    /** Salida registrada sin retorno efectivo (residente fuera del centro). */
    salidaAbierta(residenteId) {
      return api.de('salidas', residenteId).find(s => !s.fechaRetorno) || null;
    },

    salidasAbiertas() {
      return api.todos('salidas')
        .filter(s => !s.fechaRetorno)
        .filter(s => { const r = api.residente(s.residenteId); return r && r.estado !== 'Egresado'; });
    },

    /** Un residente está "presente" si está activo y no tiene salida abierta. */
    presentes() {
      return api.activos().filter(r => !api.salidaAbierta(r.id));
    },

    fueraDelCentro() {
      return api.activos().filter(r => api.salidaAbierta(r.id));
    },

    /** true si la salida superó la fecha/hora prevista de retorno. */
    retornoAtrasado(s) {
      if (s.fechaRetorno || !s.fechaRetornoPrev) return false;
      const hoy = U.hoy();
      if (s.fechaRetornoPrev < hoy) return true;
      if (s.fechaRetornoPrev === hoy && s.horaRetornoPrev) return U.ahora() > s.horaRetornoPrev;
      return false;
    },

    estadoSalida(s) {
      if (s.fechaRetorno) return 'Retornado';
      return api.retornoAtrasado(s) ? 'Atrasado' : 'Fuera del centro';
    },

    /** Faltas del residente dentro de los últimos N días. */
    faltasRecientes(residenteId, dias) {
      const desde = U.sumaDias(U.hoy(), -(dias || 30));
      return api.de('conductas', residenteId).filter(c => c.fecha >= desde);
    },

    /** Puntaje de gravedad acumulado: leve 1, grave 3, gravísima 5. */
    pesoFalta(gravedad) {
      return { 'Leve': 1, 'Grave': 3, 'Gravísima': 5 }[gravedad] || 1;
    },

    /** Llamadas realizadas por un residente en una fecha. */
    llamadasDelDia(residenteId, fecha) {
      return U.suma(
        api.de('llamadas', residenteId).filter(l => l.fecha === fecha),
        l => l.cantidad
      );
    },

    /* ---------- progreso de etapa ---------- */

    /** Días que dura cada etapa. Las que no figuran no tienen plazo definido.
     *  El centro cuenta los meses de 30 días: 1,5 meses = 45, 2 meses = 60. */
    DURACIONES: {
      'Compromiso': 15,
      'Grupo 4': 45,
      'Grupo 3': 45,
      'Grupo 2': 45,
      'Grupo 1': 30,
      'Nivel 1': 60,
      'Nivel 2': 60
    },

    /** Días que el centro cuenta por mes. */
    DIAS_MES: 30,

    /** Meses (aproximados) que representan unos días de tratamiento. */
    meses(dias) {
      return Math.round(dias / api.DIAS_MES * 10) / 10;
    },

    /**
     * Etapas a las que se entra por decisión y no por calendario: el tiempo
     * habilita la opción, pero no obliga a tomarla.
     * Nivel 3 es la etapa de reinserción y admite dos modalidades.
     */
    OPTATIVAS: {
      'Nivel 3': {
        nota: 'Etapa optativa de reinserción',
        opciones: [
          { v: 'Reinserción laboral', dias: 300, meses: 10 },
          { v: 'Reinserción social', dias: 330, meses: 11 }
        ]
      }
    },

    esOptativa(etapa) { return !!api.OPTATIVAS[etapa]; },

    /** Modalidades de una etapa optativa, con la fecha en que se habilitan. */
    opcionesOptativas(r, etapa) {
      const def = api.OPTATIVAS[etapa];
      if (!def) return [];
      const dias = api.diasEstadia(r);
      return def.opciones.map(o => Object.assign({}, o, {
        fecha: U.sumaDias(r.fechaIngreso || U.hoy(), o.dias),
        disponible: dias >= o.dias,
        restante: o.dias - dias
      }));
    },

    /** Días de antelación con que se avisa que un residente está por progresar. */
    DIAS_AVISO_ETAPA: 7,

    /** Días de tratamiento que abarca el plan con plazos (300 = 10 meses). */
    get PLAN_TOTAL() {
      return Object.keys(api.DURACIONES).reduce((t, k) => t + api.DURACIONES[k], 0);
    },

    /** Días de tratamiento cumplidos al empezar una etapa (Compromiso = 0,
     *  Grupo 4 = 15, Grupo 3 = 60, Grupo 2 = 105, Grupo 1 = 150, Nivel 1 = 180,
     *  Nivel 2 = 240, Nivel 3 = 300). */
    inicioPrevisto(etapa) {
      const i = api.ETAPAS.indexOf(etapa);
      if (i <= 0) return 0;
      let acum = 0;
      for (let k = 0; k < i; k++) acum += api.DURACIONES[api.ETAPAS[k]] || 0;
      return acum;
    },

    /**
     * Etapa que corresponde según los días de tratamiento: el tiempo en el
     * centro es lo que determina el avance por la escalera del programa,
     * desde Compromiso hasta Nivel 2 (300 días, 10 meses).
     * El cálculo se detiene ahí: Nivel 3 y los cargos posteriores no los
     * impone el calendario sino la decisión del residente y del equipo.
     */
    etapaPorDias(dias) {
      let acum = 0;
      for (let i = 0; i < api.ETAPAS.length; i++) {
        const etapa = api.ETAPAS[i];
        if (api.esOptativa(etapa)) return api.ETAPAS[i - 1] || etapa;
        const dur = api.DURACIONES[etapa];
        if (!dur) return etapa;
        if (dias < acum + dur) return etapa;
        acum += dur;
      }
      return api.ETAPAS[api.ETAPAS.length - 1];
    },

    /**
     * Fecha en que el residente entró a su etapa actual.
     * Si el equipo no la registró, se deduce del plan: la etapa empieza
     * cuando el residente cumple los días de tratamiento que la anteceden.
     */
    etapaDesde(r) {
      if (!r) return U.hoy();
      if (r.etapaDesde) return r.etapaDesde;
      const ingreso = r.fechaIngreso || U.hoy();
      const previstos = api.inicioPrevisto(r.etapa);
      // Nunca una fecha futura: si llegó a la etapa antes de lo previsto,
      // el cálculo se ancla en el día de hoy hasta que el equipo corrija.
      return U.sumaDias(ingreso, Math.min(previstos, Math.max(0, api.diasEstadia(r))));
    },

    /** true si la fecha de inicio de etapa es deducida y no registrada. */
    etapaDesdeEstimada(r) { return !(r && r.etapaDesde); },

    etapaSiguiente(etapa) {
      const i = api.ETAPAS.indexOf(etapa);
      return (i >= 0 && i < api.ETAPAS.length - 1) ? api.ETAPAS[i + 1] : null;
    },

    /**
     * Estado de avance del residente dentro de su etapa actual.
     * estado: 'sin-plazo' | 'en-curso' | 'proximo' | 'cumplido'
     */
    progresoEtapa(r) {
      const etapa = r.etapa || '';
      const desde = api.etapaDesde(r);
      const dias = Math.max(0, U.dias(desde, U.hoy()));
      const requerido = api.DURACIONES[etapa] || null;
      const siguiente = api.etapaSiguiente(etapa);

      /* El tiempo de tratamiento manda: se compara la etapa registrada con la
         que corresponde por los días en el centro. */
      const diasTratamiento = api.diasEstadia(r);
      const corresponde = api.etapaPorDias(diasTratamiento);
      const desfase = api.ETAPAS.indexOf(corresponde) - api.ETAPAS.indexOf(etapa);

      const base = {
        etapa, desde, dias, siguiente,
        estimada: api.etapaDesdeEstimada(r),
        diasTratamiento, corresponde,
        // >0: el tiempo indica una etapa más avanzada que la registrada
        desfase: isNaN(desfase) ? 0 : desfase,
        // Está al día si el tiempo indica su etapa o si ya cumplió los días
        // con que se accede a ella (caso de Nivel 3 y de los cargos).
        alDia: corresponde === etapa || diasTratamiento >= api.inicioPrevisto(etapa),
        enOptativa: api.esOptativa(etapa),
        modalidad: r.modalidad || '',
        // Etapa optativa a la que puede acceder a continuación, si la hay.
        optativa: api.esOptativa(siguiente)
          ? { etapa: siguiente, opciones: api.opcionesOptativas(r, siguiente) }
          : null
      };

      if (!requerido) {
        return Object.assign(base, { requerido: null, estado: 'sin-plazo', porcentaje: null });
      }
      const restante = requerido - dias;
      let estado = restante <= 0 ? 'cumplido'
        : (restante <= api.DIAS_AVISO_ETAPA ? 'proximo' : 'en-curso');
      // Cumplir el plazo cuando lo que sigue es optativo no es un pendiente:
      // habilita la opción de tomarlo (Nivel 2 → Nivel 3).
      if (estado === 'cumplido' && api.esOptativa(siguiente)) estado = 'optativa';

      return Object.assign(base, {
        requerido, restante, estado,
        fechaPrevista: U.sumaDias(desde, requerido),
        porcentaje: Math.min(100, Math.round(dias / requerido * 100))
      });
    },

    /** Fecha en que el residente cumple los días para pasar a la etapa siguiente. */
    fechaCambioPrevista(r) {
      const p = api.progresoEtapa(r);
      return p.requerido ? p.fechaPrevista : null;
    },

    /** Historial de etapas del residente, de la más antigua a la actual. */
    historialEtapas(r) {
      const previas = api.de('etapas', r.id)
        .slice()
        .sort((a, b) => String(a.desde).localeCompare(String(b.desde)));
      if (previas.length) return previas;
      // Fichas anteriores a este registro: se muestra solo la etapa actual.
      return [{ residenteId: r.id, etapa: r.etapa, desde: api.etapaDesde(r), hasta: '' }];
    },

    /* ---------- brigadas ---------- */

    /** Brigadas de un residente. Un residente puede tener más de una.
     *  Acepta fichas antiguas que guardaban una sola brigada como texto. */
    brigadasDe(r) {
      if (!r) return [];
      if (Array.isArray(r.brigadas)) return r.brigadas.filter(Boolean);
      return r.brigada ? [r.brigada] : [];
    },

    brigadasTexto(r, sep) {
      return api.brigadasDe(r).join(sep || ' · ');
    },

    /** Residentes activos asignados a una brigada. */
    residentesDeBrigada(nombre) {
      return api.activos().filter(r => api.brigadasDe(r).includes(nombre));
    },

    /** Grupo a cargo de una brigada sin encargado individual, o null. */
    brigadaColectiva(nombre) {
      return (api.config.brigadasColectivas || {})[nombre] || null;
    },

    /** Días de permanencia (a la fecha de egreso o a hoy). */
    diasEstadia(r) {
      if (!r.fechaIngreso) return 0;
      return Math.max(0, U.dias(r.fechaIngreso, r.fechaEgreso || U.hoy()));
    },

    /* ---------- catálogos ---------- */

    /* Clasificación del centro (cargo, nivel o grupo), ordenada desde el
       ingreso hasta la etapa más avanzada. Si el orden real del programa
       es distinto, basta con reordenar esta lista. */
    ETAPAS: [
      'Compromiso',
      'Grupo 4',
      'Grupo 3',
      'Grupo 2',
      'Grupo 1',
      'Nivel 1',
      'Nivel 2',
      'Nivel 3',
      'Reeducado',
      'Delegado',
      'Encargado de Casa',
      'Asistente',
      'Operador'
    ],

    ESTADOS: ['Activo', 'Egresado'],

    SEXOS: ['Masculino', 'Femenino', 'Otro'],

    GRAVEDADES: ['Leve', 'Grave', 'Gravísima'],

    /* Estos dos catálogos se editan desde Configuración. */
    get TIPOS_FALTA() { return estado.config.tiposFalta || []; },
    get MEDIDAS() { return estado.config.medidas || []; },

    TIPOS_SALIDA: [
      'Permiso familiar',
      'Control médico',
      'Trámite / diligencia',
      'Actividad laboral',
      'Citación judicial',
      'Actividad terapéutica externa',
      'Otro'
    ],

    TIPOS_TAREA: ['Realizada por el residente', 'Delegada a otro residente', 'Apoyo a la brigada'],

    ESTADOS_TAREA: ['Pendiente', 'Cumplida', 'Cumplida parcialmente', 'No cumplida'],

    EVALUACIONES: ['Excelente', 'Buena', 'Regular', 'Deficiente'],

    TIPOS_EGRESO: [
      'Alta terapéutica',
      'Alta administrativa',
      'Alta voluntaria',
      'Abandono de tratamiento',
      'Derivación a otro centro',
      'Egreso disciplinario',
      'Otro'
    ]
  };

  return api;
})();


/* ===== app.js ===== */
/* ============================================================
   app.js — enrutador, navegación, acciones globales
   ============================================================ */

/** Registro de vistas: cada módulo agrega su entrada aquí.
 *  { titulo, sub, acciones()->html, render(params)->html, luego(params) } */
const Vistas = {};

/** Registro de acciones delegadas: data-action="nombre" */
const Acciones = {};

const App = {

  params: {},
  rutaActual: '',

  /* ---------- arranque ---------- */

  iniciar() {
    document.documentElement.setAttribute('data-theme', DB.config.tema || 'light');

    // El logotipo del centro también se usa como icono de la pestaña.
    const favicon = document.getElementById('favicon');
    if (favicon && typeof LOGO === 'string') favicon.href = LOGO;

    // La primera vez en un equipo se carga la nómina de residentes del centro.
    if (typeof NOMINA !== 'undefined') NOMINA.autoCargar();

    // Cuentas de acceso: se crean la primera vez, después de la nómina para
    // poder vincularlas con los residentes de Nivel 1 y Nivel 2.
    if (!DB.config.cuentasCreadas) Auth.sembrarCuentas();

    window.addEventListener('hashchange', App.enrutar);

    if (!DB.almacenamientoOK) {
      UI.toast('Este navegador bloquea el almacenamiento local. Los datos no se conservarán.', 'err');
    }

    // Si se pulsa un enlace que apunta a la dirección actual, el navegador no
    // emite hashchange: se vuelve a pintar a mano para reaplicar sus filtros.
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#/"]');
      if (a && a.getAttribute('href') === location.hash) {
        e.preventDefault();
        App.enrutar();
      }
    });

    // Delegación de clics
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const fn = Acciones[el.dataset.action];
      if (!fn) return;
      e.preventDefault();
      fn(el.dataset, el, e);
    });

    // Delegación de cambios en filtros
    document.addEventListener('input', e => {
      const el = e.target.closest('[data-filtro]');
      if (el) App.refrescar();
    });
    document.addEventListener('change', e => {
      const el = e.target.closest('[data-filtro]');
      if (el) App.refrescar();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && UI._stack.length) {
        UI._stack[UI._stack.length - 1]._cerrar();
      }
    });

    // Nada se muestra mientras no haya una sesión válida.
    if (Auth.sesion()) {
      document.getElementById('app').hidden = false;
      Auth.entrarALaApp();
    } else {
      Auth.pantallaLogin();
    }
  },

  /* ---------- enrutado ---------- */

  /** Lee los filtros que vienen en el enlace: #/residentes?estado=presentes */
  parseConsulta(s) {
    const o = {};
    if (!s) return o;
    s.split('&').forEach(par => {
      if (!par) return;
      const i = par.indexOf('=');
      const k = decodeURIComponent(i < 0 ? par : par.slice(0, i));
      const v = i < 0 ? '' : decodeURIComponent(par.slice(i + 1).replace(/\+/g, ' '));
      if (k) o[k] = v;
    });
    return o;
  },

  enrutar() {
    const bruto = location.hash.replace(/^#\/?/, '') || 'dashboard';
    const corte = bruto.indexOf('?');
    const camino = corte < 0 ? bruto : bruto.slice(0, corte);
    const consulta = corte < 0 ? '' : bruto.slice(corte + 1);

    const partes = camino.split('/');
    let ruta = partes[0] || 'dashboard';

    // Sin permiso para la sección se redirige a la primera disponible del rol.
    if (!Auth.puede(ruta)) {
      const destino = Auth.rutaInicial();
      if (ruta !== destino) {
        if (Vistas[ruta]) UI.toast('Su cuenta no tiene acceso a esa sección.', 'warn');
        ruta = destino;
        if (location.hash !== '#/' + destino) location.hash = '#/' + destino;
      }
    }

    App.params = { id: partes[1] || null, sub: partes[2] || null };
    App.rutaActual = ruta;

    const v = Vistas[ruta] || Vistas.dashboard;
    // Los filtros son propios de cada vista y se toman del propio enlace,
    // de modo que los indicadores del Dashboard puedan abrir una sección
    // ya filtrada.
    App.filtros = App.parseConsulta(consulta);
    App.rutaPrevia = ruta;
    App.vistaActual = v;

    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.ruta === (v.nav || ruta));
    });
    App.menu(false);

    App.pintar();
    window.scrollTo(0, 0);
  },

  pintar() {
    const v = App.vistaActual;
    const p = App.params;
    document.getElementById('titulo').textContent =
      typeof v.titulo === 'function' ? v.titulo(p) : v.titulo;
    document.getElementById('subtitulo').innerHTML =
      typeof v.sub === 'function' ? v.sub(p) : (v.sub || '');
    document.getElementById('acciones-vista').innerHTML =
      v.acciones ? v.acciones(p) : '';
    document.getElementById('vista').innerHTML = v.render(p);
    if (v.luego) v.luego(p);
    App.pintarSidebar();
  },

  /** Vuelve a renderizar la vista actual conservando filtros, foco y cursor. */
  refrescar() {
    const filtros = {};
    document.querySelectorAll('[data-filtro]').forEach(el => { filtros[el.dataset.filtro] = el.value; });
    App.filtros = filtros;

    const activo = document.activeElement;
    const foco = activo && activo.dataset ? activo.dataset.filtro : null;
    const caret = activo && typeof activo.selectionStart === 'number' ? activo.selectionStart : null;

    App.pintar();

    if (foco) {
      const el = document.querySelector(`[data-filtro="${foco}"]`);
      if (el) {
        el.focus();
        if (caret !== null && typeof el.setSelectionRange === 'function') {
          try { el.setSelectionRange(caret, caret); } catch (e) { /* tipos sin selección */ }
        }
      }
    }
  },

  filtros: {},
  f(nombre, def) {
    const v = App.filtros[nombre];
    return v === undefined || v === null ? (def || '') : v;
  },

  ir(ruta) { location.hash = '#/' + ruta; },

  /* ---------- barra lateral ---------- */

  /* Cada contador cuenta solo lo que corresponde a su propia sección:
     el del Dashboard resume todas las alertas, el de Conducta muestra
     únicamente las alertas conductuales. */
  NAV: [
    { g: 'General' },
    {
      r: 'dashboard', l: 'Dashboard', i: '📊',
      badge: () => Alertas.pendientes().length,
      titulo: n => `${n} alerta(s) pendiente(s) de atender`
    },
    { r: 'residentes', l: 'Residentes', i: '👥' },
    { g: 'Registro diario' },
    {
      r: 'evoluciones', l: 'Evoluciones', i: '📈',
      badge: () => DB.activos().filter(r => {
        const p = DB.progresoEtapa(r);
        return p.desfase > 0 || p.estado === 'cumplido';
      }).length,
      titulo: n => `${n} residente(s) con la etapa por actualizar o con el plazo ya cumplido`
    },
    {
      r: 'conducta', l: 'Conducta', i: '⚠️',
      badge: () => Alertas.deConducta().length,
      titulo: n => `${n} alerta(s) de conducta: faltas graves de los últimos 7 días y reincidencias`
    },
    { r: 'salidas', l: 'Salidas y retornos', i: '🚪' },
    { r: 'llamadas', l: 'Llamadas', i: '📞' },
    { r: 'tareas', l: 'Tareas y brigadas', i: '🧹' },
    { g: 'Documentación' },
    { r: 'reportes', l: 'Reportes', i: '📄' },
    { g: 'Administración' },
    { r: 'usuarios', l: 'Usuarios y accesos', i: '🔑' },
    { r: 'configuracion', l: 'Configuración', i: '⚙️' }
  ],

  pintarSidebar() {
    // Solo se muestran las secciones a las que la cuenta tiene acceso. El
    // título de un grupo se emite recién cuando aparece su primera sección
    // visible, para no dejar encabezados sueltos.
    const menu = [];
    let grupoPendiente = null;
    App.NAV.forEach(n => {
      if (n.g) { grupoPendiente = n; return; }
      if (!Auth.puede(n.r)) return;
      if (grupoPendiente) { menu.push(grupoPendiente); grupoPendiente = null; }
      menu.push(n);
    });

    document.getElementById('nav').innerHTML = menu.map(n => {
      if (n.g) return `<div class="nav-label">${U.esc(n.g)}</div>`;
      const cuenta = n.badge ? n.badge() : 0;
      const badge = cuenta ? `<span class="badge-count">${cuenta}</span>` : '';
      const titulo = cuenta && n.titulo ? ` title="${U.esc(n.titulo(cuenta))}"` : '';
      return `<a class="nav-item" href="#/${n.r}" data-ruta="${n.r}"${titulo}>
        <span class="ico">${n.i}</span><span>${U.esc(n.l)}</span>${badge}</a>`;
    }).join('');
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.ruta === (App.vistaActual && App.vistaActual.nav || App.rutaActual));
    });
    document.getElementById('nombre-centro').textContent = DB.config.centro;
    document.getElementById('lema-centro').textContent = DB.config.lema || 'Gestión de residentes';

    const logo = document.getElementById('logo-centro');
    if (logo && logo.src !== LOGO) logo.src = LOGO;

    // Bloque de sesión al pie del menú
    const s = Auth.sesion();
    const caja = document.getElementById('sesion');
    if (caja) {
      caja.innerHTML = s ? `
        <button type="button" class="sesion-chip" data-action="cambiar-clave"
                title="Cambiar mi contraseña">
          <span class="avatar" style="width:28px;height:28px;flex-basis:28px;font-size:11px">
            ${U.esc(U.iniciales(s.nombre))}</span>
          <span style="min-width:0">
            <span class="sesion-nombre">${U.esc(s.nombre)}</span>
            <span class="sesion-rol">${s.rol === 'total' ? 'Acceso total' : 'Acceso limitado'}</span>
          </span>
        </button>` : '';
    }
  },

  /* ---------- ayudas comunes ---------- */

  /** <select> de residentes para formularios. */
  opcionesResidentes(incluirEgresados) {
    const rs = (incluirEgresados ? DB.todos('residentes') : DB.activos())
      .slice().sort((a, b) => a.nombre.localeCompare(b.nombre));
    return rs.map(r => ({ v: r.id, l: r.nombre + (r.estado === 'Egresado' ? ' (egresado)' : '') }));
  },

  /** Enlace a la ficha de un residente; texto plano si la cuenta no puede abrirla. */
  enlaceResidente(id) {
    const r = DB.residente(id);
    if (!r) return `<span class="faint">Residente eliminado</span>`;
    if (!Auth.puede('residente')) return U.esc(r.nombre);
    return `<a href="#/residente/${r.id}">${U.esc(r.nombre)}</a>`;
  },

  /* Color por familia de etapa: grupos (azul), niveles (verde institucional),
     cargos de responsabilidad (morado y verde). */
  COLORES_ETAPA: {
    'Compromiso': 'b-gray',
    'Grupo 4': 'b-info', 'Grupo 3': 'b-info', 'Grupo 2': 'b-info', 'Grupo 1': 'b-info',
    'Nivel 1': 'b-primary', 'Nivel 2': 'b-primary', 'Nivel 3': 'b-primary',
    'Reeducado': 'b-purple', 'Delegado': 'b-purple', 'Encargado de Casa': 'b-purple',
    'Asistente': 'b-ok', 'Operador': 'b-ok'
  },

  badgeEtapa(etapa) {
    const cls = App.COLORES_ETAPA[etapa] || 'b-gray';
    return `<span class="badge ${cls}">${U.esc(etapa || 'Sin etapa')}</span>`;
  },

  badgeEstadoResidente(r) {
    if (r.estado === 'Egresado') return `<span class="badge b-gray">Egresado</span>`;
    const s = DB.salidaAbierta(r.id);
    if (s) {
      return DB.retornoAtrasado(s)
        ? `<span class="badge b-danger">Retorno atrasado</span>`
        : `<span class="badge b-warn">Fuera del centro</span>`;
    }
    return `<span class="badge b-ok">Presente</span>`;
  },

  badgeGravedad(g) {
    const cls = { 'Leve': 'b-warn', 'Grave': 'b-danger', 'Gravísima': 'b-danger' }[g] || 'b-gray';
    return `<span class="badge ${cls}">${U.esc(g || '—')}</span>`;
  },

  badgeEstadoTarea(e) {
    const cls = {
      'Cumplida': 'b-ok', 'Cumplida parcialmente': 'b-warn',
      'No cumplida': 'b-danger', 'Pendiente': 'b-gray'
    }[e] || 'b-gray';
    return `<span class="badge ${cls}">${U.esc(e || '—')}</span>`;
  },

  /** Barra de herramientas estándar: búsqueda + filtros extra. */
  toolbar(partes) {
    return `<div class="toolbar">${partes.join('')}</div>`;
  },

  buscador(ph) {
    return `<div class="search"><input type="search" data-filtro="q" value="${U.esc(App.f('q'))}"
      placeholder="${U.esc(ph || 'Buscar…')}"></div>`;
  },

  selectFiltro(nombre, etiquetaVacia, opciones, valorActual) {
    const v = valorActual !== undefined ? valorActual : App.f(nombre);
    return `<select data-filtro="${nombre}">
      <option value="">${U.esc(etiquetaVacia)}</option>
      ${opciones.map(o => {
        const val = typeof o === 'object' ? o.v : o;
        const lab = typeof o === 'object' ? o.l : o;
        return `<option value="${U.esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${U.esc(lab)}</option>`;
      }).join('')}
    </select>`;
  },

  /** Botones de edición/eliminación para filas de tabla.
   *  Eliminar queda reservado a las cuentas con acceso total. */
  accionesFila(col, id, etiqueta) {
    return `<button class="btn btn-sm btn-ghost" data-action="editar-${col}" data-id="${id}" title="Editar">✏️</button>` +
      (Auth.esTotal()
        ? `<button class="btn btn-sm btn-ghost" data-action="eliminar" data-col="${col}" data-id="${id}"
             data-etiqueta="${U.esc(etiqueta || 'este registro')}" title="Eliminar">🗑️</button>`
        : '');
  }
};

/* ---------- acciones globales ---------- */

Acciones['eliminar'] = d => {
  if (!Auth.esTotal()) {
    return UI.toast('Su cuenta no puede eliminar registros. Solicítelo a la dirección.', 'err');
  }
  UI.confirmar({
    title: 'Eliminar registro',
    peligro: true,
    submit: 'Eliminar',
    body: `¿Seguro que desea eliminar <b>${U.esc(d.etiqueta)}</b>?<br>
      <span class="muted small">Esta acción no se puede deshacer.</span>`,
    onSubmit: () => {
      DB.eliminar(d.col, d.id);
      UI.toast('Registro eliminado.');
      App.pintar();
    }
  });
};

Acciones['tema'] = () => {
  const nuevo = (DB.config.tema === 'dark') ? 'light' : 'dark';
  DB.guardarConfig({ tema: nuevo });
  document.documentElement.setAttribute('data-theme', nuevo);
};

/* ---------- menú lateral en móvil ---------- */

App.menu = function (abrir) {
  const lateral = document.querySelector('.sidebar');
  const scrim = document.getElementById('scrim');
  const abierto = abrir === undefined ? !lateral.classList.contains('open') : abrir;
  lateral.classList.toggle('open', abierto);
  if (scrim) scrim.hidden = !abierto;
  // No se libera el scroll si hay un modal abierto, que también lo bloquea.
  if (abierto) document.body.style.overflow = 'hidden';
  else if (!UI._stack.length) document.body.style.overflow = '';
};

Acciones['menu'] = () => App.menu();
Acciones['cerrar-menu'] = () => App.menu(false);

Acciones['imprimir'] = () => window.print();

document.addEventListener('DOMContentLoaded', App.iniciar);


/* ===== alertas.js ===== */
/* ============================================================
   alertas.js — motor de alertas del centro
   ============================================================
   Cada alerta: { tipo, ico, titulo, detalle, ruta, prioridad }
   prioridad: 1 alta (roja), 2 media (ámbar), 3 informativa
   ============================================================ */

const Alertas = {

  /** Nº de faltas en 30 días que dispara una alerta de reincidencia. */
  FALTAS_REINCIDENCIA: 3,

  /* ---------- alertas atendidas ---------- */

  /**
   * Marca una alerta como atendida para que deje de mostrarse.
   * La clave incluye la gravedad de la situación, de modo que si esta empeora
   * (un día más de atraso, una falta más) la alerta vuelve a aparecer.
   */
  marcarVista(clave) {
    const vistas = Object.assign({}, DB.config.alertasVistas || {});
    vistas[clave] = U.hoy();
    DB.guardarConfig({ alertasVistas: vistas });
  },

  restaurarTodas() {
    DB.guardarConfig({ alertasVistas: {} });
  },

  estaVista(clave) {
    return !!(DB.config.alertasVistas || {})[clave];
  },

  /** Alertas que aún no han sido atendidas. */
  pendientes() {
    return Alertas.todas().filter(a => !Alertas.estaVista(a.clave));
  },

  atendidas() {
    return Alertas.todas().filter(a => Alertas.estaVista(a.clave));
  },

  todas() {
    const out = [];
    const hoy = U.hoy();

    /* --- 1. Retornos atrasados --- */
    DB.salidasAbiertas().forEach(s => {
      if (!DB.retornoAtrasado(s)) return;
      const r = DB.residente(s.residenteId);
      const atraso = U.dias(s.fechaRetornoPrev, hoy);
      out.push({
        tipo: 'salida',
        clave: `salida:${s.id}:${atraso}`,
        prioridad: 1,
        ico: '🚨',
        titulo: `${r.nombre} no ha retornado al centro`,
        detalle: `Salió el ${U.fecha(s.fechaSalida)} por "${s.tipo}". Retorno previsto: ${U.fecha(s.fechaRetornoPrev)}` +
          (atraso > 0 ? ` (${U.plural(atraso, 'día de atraso', 'días de atraso')}).` : ' (hora vencida).'),
        ruta: `#/residente/${r.id}`
      });
    });

    /* --- 2. Faltas graves recientes --- */
    const desde7 = U.sumaDias(hoy, -7);
    DB.todos('conductas')
      .filter(c => c.fecha >= desde7 && (c.gravedad === 'Grave' || c.gravedad === 'Gravísima'))
      .sort(U.porFechaDesc())
      .forEach(c => {
        const r = DB.residente(c.residenteId);
        if (!r) return;
        out.push({
          tipo: 'conducta',
          clave: `conducta:${c.id}`,
          prioridad: c.gravedad === 'Gravísima' ? 1 : 2,
          ico: c.gravedad === 'Gravísima' ? '🔴' : '⚠️',
          titulo: `Falta ${c.gravedad.toLowerCase()} de ${r.nombre}`,
          detalle: `${c.tipoFalta} · ${U.fecha(c.fecha)}${c.medida ? ' · Medida: ' + c.medida : ' · Sin medida registrada'}`,
          ruta: `#/residente/${r.id}`
        });
      });

    /* --- 3. Reincidencia conductual --- */
    DB.activos().forEach(r => {
      const faltas = DB.faltasRecientes(r.id, 30);
      if (faltas.length >= Alertas.FALTAS_REINCIDENCIA) {
        const peso = U.suma(faltas, f => DB.pesoFalta(f.gravedad));
        out.push({
          tipo: 'reincidencia',
          clave: `reincidencia:${r.id}:${faltas.length}`,
          prioridad: 2,
          ico: '📈',
          titulo: `${r.nombre} acumula ${faltas.length} faltas en 30 días`,
          detalle: `Puntaje de gravedad acumulado: ${peso}. Se sugiere evaluación por el equipo técnico.`,
          ruta: `#/residente/${r.id}`
        });
      }
    });

    /* --- 4. Tareas pendientes vencidas --- */
    const vencidas = DB.todos('tareas').filter(t => t.estado === 'Pendiente' && t.fecha < hoy);
    if (vencidas.length) {
      out.push({
        tipo: 'tarea',
        clave: `tarea:vencidas:${vencidas.length}`,
        prioridad: 3,
        ico: '🧹',
        titulo: `${vencidas.length} ${vencidas.length === 1 ? 'tarea pendiente vencida' : 'tareas pendientes vencidas'}`,
        detalle: 'Hay tareas asignadas cuya fecha ya pasó y siguen sin evaluar.',
        ruta: '#/tareas'
      });
    }

    /* --- 5. Exceso de llamadas --- */
    const max = Number(DB.config.maxLlamadasDia) || 0;
    if (max > 0) {
      const desde = U.sumaDias(hoy, -7);
      const porDia = {};
      DB.todos('llamadas').filter(l => l.fecha >= desde).forEach(l => {
        const k = l.residenteId + '|' + l.fecha;
        porDia[k] = (porDia[k] || 0) + (Number(l.cantidad) || 0);
      });
      Object.keys(porDia).forEach(k => {
        if (porDia[k] <= max) return;
        const [rid, fecha] = k.split('|');
        const r = DB.residente(rid);
        if (!r) return;
        out.push({
          tipo: 'llamada',
          clave: `llamada:${rid}:${fecha}:${porDia[k]}`,
          prioridad: 3,
          ico: '📞',
          titulo: `${r.nombre} superó el máximo de llamadas`,
          detalle: `${porDia[k]} llamadas el ${U.fecha(fecha)} (máximo configurado: ${max}).`,
          ruta: `#/residente/${r.id}`
        });
      });
    }

    /* --- 6. Residentes próximos a progresar de etapa --- */
    DB.activos().forEach(r => {
      const p = DB.progresoEtapa(r);

      /* El tiempo de tratamiento manda: si la etapa registrada quedó atrás,
         el aviso es que corresponde actualizarla. */
      if (p.desfase > 0) {
        out.push({
          tipo: 'etapa',
          clave: `etapa:${r.id}:desfase:${p.corresponde}`,
          prioridad: 2,
          ico: '⏱️',
          titulo: `${r.nombre} debería estar en ${p.corresponde}`,
          detalle: `Lleva ${p.diasTratamiento} días de tratamiento y figura en ${p.etapa}. ` +
            `Corresponde actualizar su etapa (${U.plural(p.desfase, 'etapa', 'etapas')} de diferencia).`,
          ruta: '#/evoluciones'
        });
        return;
      }

      /* Etapa optativa (Nivel 3): el tiempo habilita la opción, no la impone. */
      if (p.optativa) {
        const listas = p.optativa.opciones.filter(o => o.disponible);
        if (listas.length) {
          out.push({
            tipo: 'etapa',
            clave: `optativa:${r.id}:${listas.length}`,
            prioridad: 3,
            ico: '🤝',
            titulo: `${r.nombre} puede optar a ${p.optativa.etapa}`,
            detalle: `Lleva ${p.diasTratamiento} días de tratamiento (${DB.meses(p.diasTratamiento)} meses). ` +
              `Modalidades disponibles: ${listas.map(o => `${o.v} (${o.meses} meses)`).join(' y ')}.`,
            ruta: '#/evoluciones'
          });
        }
        // No se insiste con «cumplió el plazo»: entrar a Nivel 3 es optativo.
        return;
      }

      if (p.estado !== 'proximo' && p.estado !== 'cumplido') return;
      if (!p.siguiente) return;
      const cumplido = p.estado === 'cumplido';
      out.push({
        tipo: 'etapa',
        clave: `etapa:${r.id}:${p.etapa}:${cumplido ? 'cumplido' : 'proximo'}`,
        prioridad: 2,
        ico: cumplido ? '⬆️' : '📅',
        titulo: cumplido
          ? `${r.nombre} cumplió el plazo de ${p.etapa}`
          : `${r.nombre} está próximo a progresar`,
        detalle: cumplido
          ? `Lleva ${p.dias} días en ${p.etapa} (plazo: ${p.requerido}). Corresponde evaluar el paso a ${p.siguiente}.`
          : `Faltan ${U.plural(p.restante, 'día', 'días')} para completar ${p.etapa} y pasar a ${p.siguiente}.`,
        ruta: '#/evoluciones'
      });
    });

    return out.sort((a, b) => a.prioridad - b.prioridad);
  },

  /** Alertas de conducta e incidentes pendientes (para el panel de conducta). */
  deConducta() {
    return Alertas.pendientes().filter(a => a.tipo === 'conducta' || a.tipo === 'reincidencia');
  },

  render(lista, opts) {
    opts = opts || {};
    if (!lista.length) {
      const atendidas = Alertas.atendidas().length;
      return `<div class="empty" style="padding:30px">
        <div class="big">✅</div>
        <div style="font-weight:600;color:var(--text-soft)">Sin alertas pendientes</div>
        <p>No hay situaciones que requieran atención en este momento.</p>
        ${atendidas ? `<button class="btn btn-sm" data-action="restaurar-alertas">
          ↺ Volver a mostrar ${U.plural(atendidas, 'alerta atendida', 'alertas atendidas')}</button>` : ''}
      </div>`;
    }
    const limite = opts.limite || lista.length;
    return lista.slice(0, limite).map(a => {
      // El botón solo se ofrece si la cuenta puede abrir esa sección.
      const seccion = String(a.ruta || '').replace(/^#\//, '').split('/')[0];
      const accesible = Auth.puede(seccion);
      return `
      <div class="alert-item">
        <div class="ai-ico">${a.ico}</div>
        <div class="ai-c">
          <div class="ai-t">${U.esc(a.titulo)}</div>
          <div class="ai-d">${U.esc(a.detalle)}</div>
        </div>
        <div class="ai-a">
          <button class="btn btn-sm" data-action="ver-alerta"
                  data-clave="${U.esc(a.clave)}"
                  data-ruta="${accesible ? U.esc(a.ruta) : ''}"
                  title="${accesible ? 'Ir al detalle y marcar como atendida' : 'Marcar como atendida'}">
            ${accesible ? 'Ver' : 'Visto'}
          </button>
        </div>
      </div>`;
    }).join('') +
      (lista.length > limite
        ? `<div class="alert-item"><div class="ai-d" style="margin:0 auto">
             y ${lista.length - limite} alerta(s) más…</div></div>`
        : '');
  }
};

/* Al pulsar «Ver» la alerta se marca como atendida y desaparece del panel.
   Si la situación empeora (otro día de atraso, una falta más) vuelve a
   aparecer, porque la clave de la alerta cambia. */
Acciones['ver-alerta'] = d => {
  Alertas.marcarVista(d.clave);
  if (d.ruta) {
    location.hash = d.ruta;
    App.enrutar();
  } else {
    UI.toast('Alerta marcada como atendida.');
    App.pintar();
  }
};

Acciones['restaurar-alertas'] = () => {
  Alertas.restaurarTodas();
  UI.toast('Se volvieron a mostrar todas las alertas.');
  App.pintar();
};


/* ===== auth.js ===== */
/* ============================================================
   auth.js — cuentas de acceso y permisos por rol
   ============================================================
   IMPORTANTE — alcance de este control de acceso:

   La aplicación funciona sin servidor: todo ocurre en el navegador
   del equipo. Por lo tanto este inicio de sesión separa roles y
   evita cambios accidentales, pero NO es una barrera de seguridad
   frente a alguien con conocimientos: quien tenga el archivo puede
   inspeccionarlo con las herramientas del navegador.

   Las contraseñas no se guardan en texto plano: se almacena un
   resumen (SHA-256 con sal, aplicado en varias vueltas).

   Para una protección real haría falta un servidor con base de
   datos y sesiones, además de cifrar el equipo donde se usa.
   ============================================================ */

/* ---------- SHA-256 (implementación propia, sin dependencias) ---------- */

const SHA256 = (() => {
  const K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  const rotr = (x, n) => (x >>> n) | (x << (32 - n));

  /** Texto a bytes UTF-8. */
  function utf8(s) {
    const b = [];
    for (let i = 0; i < s.length; i++) {
      let c = s.charCodeAt(i);
      if (c < 0x80) b.push(c);
      else if (c < 0x800) b.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c < 0xd800 || c >= 0xe000) b.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      else {
        const c2 = s.charCodeAt(++i);
        const cp = 0x10000 + (((c & 0x3ff) << 10) | (c2 & 0x3ff));
        b.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      }
    }
    return b;
  }

  return function (texto) {
    const bytes = utf8(texto);
    const bits = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bytes.push(0, 0, 0, 0,
      (bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255);

    const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
      0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Array(64);

    for (let i = 0; i < bytes.length; i += 64) {
      for (let j = 0; j < 16; j++) {
        w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) |
          (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
      }
      for (let j = 16; j < 64; j++) {
        const a15 = w[j - 15], a2 = w[j - 2];
        const s0 = rotr(a15, 7) ^ rotr(a15, 18) ^ (a15 >>> 3);
        const s1 = rotr(a2, 17) ^ rotr(a2, 19) ^ (a2 >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
      }

      let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let j = 0; j < 64; j++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
      H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
      H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }

    return H.map(x => ('00000000' + x.toString(16)).slice(-8)).join('');
  };
})();


/* ============================================================
   Auth — sesión, cuentas y permisos
   ============================================================ */

const Auth = {

  CLAVE_SESION: 'crc_sesion',
  VUELTAS: 3000,

  /* ---------- roles y permisos ---------- */

  ROLES: [
    { v: 'total', l: 'Acceso total' },
    { v: 'limitado', l: 'Acceso limitado (tareas, llamadas, salidas y conducta)' }
  ],

  SECCIONES: {
    total: ['dashboard', 'residentes', 'residente', 'evoluciones', 'conducta',
      'salidas', 'llamadas', 'tareas', 'reportes', 'usuarios', 'configuracion'],
    limitado: ['tareas', 'llamadas', 'salidas', 'conducta']
  },

  etiquetaRol(rol) {
    const r = Auth.ROLES.find(x => x.v === rol);
    return r ? r.l : rol;
  },

  /* ---------- contraseñas ---------- */

  sal() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  },

  /** Resumen con sal, repetido varias vueltas para encarecer la prueba a ciegas. */
  resumen(clave, sal) {
    let h = SHA256(sal + '|' + clave);
    for (let i = 0; i < Auth.VUELTAS; i++) h = SHA256(h + sal);
    return h;
  },

  /* ---------- cuentas ---------- */

  usuarios() {
    return DB.todos('usuarios');
  },

  porNombre(usuario) {
    const u = U.norm(usuario).trim();
    return Auth.usuarios().find(x => U.norm(x.usuario) === u) || null;
  },

  /**
   * Genera un nombre de usuario libre a partir del nombre de la persona:
   * primer nombre + primer apellido.
   *
   * En el uso chileno los dos últimos términos suelen ser los apellidos, de
   * modo que con cuatro o más palabras el primer apellido es el penúltimo.
   * Con tres palabras el reparto es ambiguo ("Clemente Donoso Barthe" frente a
   * "Julio César Sierralta"), así que se toma la última. El nombre de usuario
   * se puede corregir después desde Usuarios y accesos.
   */
  nombreDeUsuario(nombreCompleto) {
    const partes = U.norm(nombreCompleto).replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
    const apellido = partes.length >= 4 ? partes[partes.length - 2] : partes[partes.length - 1];
    let base = (partes[0] || 'usuario') + (partes.length > 1 ? '.' + apellido : '');
    let nombre = base, n = 2;
    while (Auth.porNombre(nombre)) nombre = base + n++;
    return nombre;
  },

  crearUsuario(datos) {
    const sal = Auth.sal();
    return DB.crear('usuarios', {
      usuario: datos.usuario,
      nombre: datos.nombre,
      rol: datos.rol,
      cargo: datos.cargo || '',
      residenteId: datos.residenteId || '',
      sal: sal,
      hash: Auth.resumen(datos.clave, sal),
      debeCambiar: datos.debeCambiar !== false,
      activo: true
    });
  },

  definirClave(id, clave, debeCambiar) {
    const sal = Auth.sal();
    DB.actualizar('usuarios', id, {
      sal: sal,
      hash: Auth.resumen(clave, sal),
      debeCambiar: !!debeCambiar
    });
  },

  /**
   * Crea las cuentas iniciales: dirección, asistente y delegado con acceso
   * total, y una cuenta por cada residente de Nivel 1 y Nivel 2 con acceso
   * limitado. La contraseña inicial es el propio nombre de usuario y debe
   * cambiarse en el primer ingreso.
   */
  sembrarCuentas() {
    const creadas = [];

    const alta = (usuario, nombre, rol, cargo, residenteId) => {
      if (Auth.porNombre(usuario)) return;
      Auth.crearUsuario({ usuario, nombre, rol, cargo, residenteId, clave: usuario, debeCambiar: true });
      creadas.push(usuario);
    };

    // Cuentas con acceso total
    const conCargo = cargo => DB.activos().find(r => r.etapa === cargo);
    const asistente = conCargo('Asistente');
    const delegado = conCargo('Delegado');

    alta('director', 'Dirección del centro', 'total', 'Director', '');
    alta('asistente', asistente ? asistente.nombre : 'Asistente', 'total', 'Asistente',
      asistente ? asistente.id : '');
    alta('delegado', delegado ? delegado.nombre : 'Delegado', 'total', 'Delegado',
      delegado ? delegado.id : '');

    // Una cuenta por cada residente de Nivel 1 y Nivel 2
    creadas.push(...Auth.crearCuentasNiveles());

    if (creadas.length) DB.guardarConfig({ cuentasCreadas: true });
    return creadas;
  },

  /** Crea las cuentas que falten para los residentes de Nivel 1 y Nivel 2. */
  crearCuentasNiveles() {
    const creadas = [];
    const conCuenta = new Set(Auth.usuarios().map(u => u.residenteId).filter(Boolean));

    DB.activos()
      .filter(r => r.etapa === 'Nivel 1' || r.etapa === 'Nivel 2')
      .sort((a, b) => a.nombre.localeCompare(b.nombre))
      .forEach(r => {
        if (conCuenta.has(r.id)) return;
        const usuario = Auth.nombreDeUsuario(r.nombre);
        Auth.crearUsuario({
          usuario, nombre: r.nombre, rol: 'limitado', cargo: r.etapa,
          residenteId: r.id, clave: usuario, debeCambiar: true
        });
        creadas.push(usuario);
      });

    return creadas;
  },

  /* ---------- sesión ---------- */

  _sesion: null,

  sesion() {
    if (Auth._sesion) return Auth._sesion;
    try {
      const id = sessionStorage.getItem(Auth.CLAVE_SESION);
      if (!id) return null;
      const u = DB.obtener('usuarios', id);
      if (!u || !u.activo) return null;
      Auth._sesion = u;
      return u;
    } catch (e) {
      return null;
    }
  },

  entrar(usuario, clave) {
    const u = Auth.porNombre(usuario);
    if (!u || !u.activo) return { ok: false, error: 'Usuario o contraseña incorrectos.' };
    if (Auth.resumen(clave, u.sal) !== u.hash) {
      return { ok: false, error: 'Usuario o contraseña incorrectos.' };
    }
    Auth._sesion = u;
    try { sessionStorage.setItem(Auth.CLAVE_SESION, u.id); } catch (e) { /* sin sessionStorage */ }
    DB.actualizar('usuarios', u.id, { ultimoIngreso: new Date().toISOString() });
    return { ok: true, usuario: u };
  },

  salir() {
    Auth._sesion = null;
    try { sessionStorage.removeItem(Auth.CLAVE_SESION); } catch (e) { /* ignorar */ }
  },

  /* ---------- permisos ---------- */

  rol() {
    const s = Auth.sesion();
    return s ? s.rol : null;
  },

  esTotal() {
    return Auth.rol() === 'total';
  },

  /** ¿La sesión actual puede entrar a esta sección? */
  puede(ruta) {
    const rol = Auth.rol();
    if (!rol) return false;
    return (Auth.SECCIONES[rol] || []).includes(ruta);
  },

  /** Primera sección disponible para el rol actual. */
  rutaInicial() {
    const rol = Auth.rol();
    if (rol === 'total') return 'dashboard';
    return (Auth.SECCIONES[rol] || ['tareas'])[0];
  },

  /* ---------- pantalla de acceso ---------- */

  pantallaLogin(mensaje) {
    document.getElementById('app').hidden = true;
    const cont = document.getElementById('login-root');
    cont.hidden = false;
    cont.innerHTML = `
      <form class="login-caja" id="form-login" novalidate>
        <div class="login-marca">
          <img src="${LOGO}" alt="">
          <div>
            <div class="login-centro">${U.esc(DB.config.centro)}</div>
            <div class="login-sub">${U.esc(DB.config.lema || 'Gestión de residentes')}</div>
          </div>
        </div>

        <h2>Iniciar sesión</h2>
        <p class="login-texto">Ingrese con la cuenta que le entregó la dirección del centro.</p>

        <div class="field">
          <label for="lg-usuario">Usuario</label>
          <input type="text" id="lg-usuario" name="usuario" autocomplete="username"
                 autocapitalize="none" spellcheck="false" placeholder="ej: director">
        </div>
        <div class="field" style="margin-top:12px">
          <label for="lg-clave">Contraseña</label>
          <input type="password" id="lg-clave" name="clave" autocomplete="current-password">
        </div>

        <div class="login-error" id="lg-error" ${mensaje ? '' : 'hidden'}>${U.esc(mensaje || '')}</div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:16px">
          Entrar
        </button>

        <div class="login-pie">
          Control de acceso local: separa los roles dentro del centro, pero no reemplaza
          proteger el equipo con contraseña de usuario.
        </div>
      </form>`;

    const form = document.getElementById('form-login');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const datos = UI.datos(form);
      const err = document.getElementById('lg-error');
      if (!datos.usuario || !datos.clave) {
        err.hidden = false;
        err.textContent = 'Escriba su usuario y su contraseña.';
        return;
      }
      const r = Auth.entrar(datos.usuario, datos.clave);
      if (!r.ok) {
        err.hidden = false;
        err.textContent = r.error;
        document.getElementById('lg-clave').value = '';
        document.getElementById('lg-clave').focus();
        return;
      }
      cont.hidden = true;
      cont.innerHTML = '';
      document.getElementById('app').hidden = false;
      Auth.entrarALaApp();
    });

    setTimeout(() => document.getElementById('lg-usuario').focus(), 40);
  },

  /** Arranca la aplicación una vez validada la sesión. */
  entrarALaApp() {
    const u = Auth.sesion();
    App.pintarSidebar();
    if (!Auth.puede(App.rutaActual)) location.hash = '#/' + Auth.rutaInicial();
    App.enrutar();
    UI.toast(`Sesión iniciada como ${u.nombre}.`);
    if (u.debeCambiar) setTimeout(() => Auth.cambiarClave(true), 400);
  },

  cerrarSesion() {
    UI.confirmar({
      title: 'Cerrar sesión',
      body: '¿Desea salir de su cuenta?',
      submit: 'Cerrar sesión',
      onSubmit: () => {
        Auth.salir();
        location.hash = '#/';
        Auth.pantallaLogin();
      }
    });
  },

  /* ---------- cambio de contraseña ---------- */

  cambiarClave(obligatorio) {
    const u = Auth.sesion();
    if (!u) return;
    UI.modal({
      title: obligatorio ? 'Defina su contraseña' : 'Cambiar contraseña',
      sub: u.nombre,
      size: 'narrow',
      cancel: obligatorio ? 'Más tarde' : 'Cancelar',
      submit: 'Guardar contraseña',
      body: `
        ${obligatorio ? `<div class="note warn" style="margin-bottom:14px">
          Su cuenta todavía usa la contraseña inicial. Defina una propia antes de
          seguir trabajando.</div>` : ''}
        ${UI.campos([
          { n: 'actual', l: 'Contraseña actual', t: 'password', w: 12, req: true },
          { n: 'nueva', l: 'Contraseña nueva', t: 'password', w: 12, req: true,
            help: 'Al menos 6 caracteres.' },
          { n: 'repetir', l: 'Repita la contraseña nueva', t: 'password', w: 12, req: true }
        ])}`,
      onSubmit: d => {
        if (Auth.resumen(d.actual, u.sal) !== u.hash) {
          UI.toast('La contraseña actual no es correcta.', 'err');
          return false;
        }
        if (String(d.nueva).length < 6) {
          UI.toast('La contraseña nueva debe tener al menos 6 caracteres.', 'err');
          return false;
        }
        if (d.nueva !== d.repetir) {
          UI.toast('Las contraseñas nuevas no coinciden.', 'err');
          return false;
        }
        Auth.definirClave(u.id, d.nueva, false);
        Auth._sesion = DB.obtener('usuarios', u.id);
        UI.toast('Contraseña actualizada.');
        App.pintar();
      }
    });
  },

  /* ---------- administración de cuentas ---------- */

  nuevaCuenta() {
    UI.modal({
      title: 'Nueva cuenta de acceso',
      size: 'wide',
      submit: 'Crear cuenta',
      body: UI.campos([
        { n: 'nombre', l: 'Nombre de la persona', t: 'text', w: 7, req: true },
        { n: 'cargo', l: 'Cargo o nivel', t: 'text', w: 5 },
        { n: 'usuario', l: 'Usuario', t: 'text', w: 6, req: true, help: 'Sin espacios ni tildes.' },
        { n: 'rol', l: 'Nivel de acceso', t: 'select', w: 6, req: true, opts: Auth.ROLES, vacio: false },
        {
          n: 'residenteId', l: 'Residente vinculado (opcional)', t: 'select', w: 12,
          opts: App.opcionesResidentes(false)
        },
        { n: 'clave', l: 'Contraseña inicial', t: 'text', w: 12, req: true,
          help: 'Se le pedirá cambiarla en su primer ingreso.' }
      ], { rol: 'limitado' }),
      onSubmit: d => {
        d.usuario = U.norm(d.usuario).replace(/[^a-z0-9._-]/g, '');
        if (!d.usuario) { UI.toast('Escriba un nombre de usuario válido.', 'err'); return false; }
        if (Auth.porNombre(d.usuario)) { UI.toast('Ese usuario ya existe.', 'err'); return false; }
        if (String(d.clave).length < 4) { UI.toast('La contraseña inicial es demasiado corta.', 'err'); return false; }
        Auth.crearUsuario(d);
        UI.toast(`Cuenta «${d.usuario}» creada.`);
        App.pintar();
      }
    });
  },

  editarCuenta(id) {
    const u = DB.obtener('usuarios', id);
    if (!u) return;
    UI.modal({
      title: 'Editar cuenta',
      sub: u.usuario,
      size: 'wide',
      body: UI.campos([
        { n: 'nombre', l: 'Nombre de la persona', t: 'text', w: 7, req: true },
        { n: 'cargo', l: 'Cargo o nivel', t: 'text', w: 5 },
        { n: 'usuario', l: 'Usuario', t: 'text', w: 6, req: true, help: 'Sin espacios ni tildes.' },
        { n: 'rol', l: 'Nivel de acceso', t: 'select', w: 6, req: true, opts: Auth.ROLES, vacio: false },
        { n: 'activo', l: 'Cuenta activa', t: 'checkbox', w: 6 },
        { n: 'residenteId', l: 'Residente vinculado', t: 'select', w: 6, opts: App.opcionesResidentes(true) }
      ], u),
      onSubmit: d => {
        const sesion = Auth.sesion();
        if (sesion && sesion.id === id && (d.rol !== 'total' || !d.activo)) {
          UI.toast('No puede quitarse a sí mismo el acceso total ni desactivar su cuenta.', 'err');
          return false;
        }
        d.usuario = U.norm(d.usuario).replace(/[^a-z0-9._-]/g, '');
        if (!d.usuario) { UI.toast('Escriba un nombre de usuario válido.', 'err'); return false; }
        const otro = Auth.porNombre(d.usuario);
        if (otro && otro.id !== id) { UI.toast('Ese usuario ya está en uso.', 'err'); return false; }
        DB.actualizar('usuarios', id, d);
        UI.toast('Cuenta actualizada.');
        App.pintar();
      }
    });
  },

  restablecerClave(id) {
    const u = DB.obtener('usuarios', id);
    if (!u) return;
    UI.modal({
      title: 'Restablecer contraseña',
      sub: `${u.nombre} · ${u.usuario}`,
      size: 'narrow',
      submit: 'Restablecer',
      body: `
        <div class="note" style="margin-bottom:14px">
          La persona deberá cambiarla la próxima vez que entre.
        </div>
        ${UI.campos([
          { n: 'clave', l: 'Contraseña nueva', t: 'text', w: 12, req: true, val: u.usuario }
        ])}`,
      onSubmit: d => {
        if (String(d.clave).length < 4) { UI.toast('La contraseña es demasiado corta.', 'err'); return false; }
        Auth.definirClave(id, d.clave, true);
        UI.toast(`Contraseña de «${u.usuario}» restablecida.`);
        App.pintar();
      }
    });
  }
};

  /** Asignación por R.U.T., para no depender de cómo esté escrito el nombre. */
  ASIGNACIONES: {
    '19.012.587-4': ['Sargento'],                    // Darío Ignacio Saavedra Pacheco
    '26.436.021-8': ['Quincho'],                     // José Francisco Yustiz Vargas
    '19.381.847-1': ['Cap de Cocina'],               // Johan Patricio Morales Villagra
