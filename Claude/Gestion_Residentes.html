    '19.231.653-7': ['Living Comedor Pasillo'],      // Wilson Bernardo Villagrán Cruces
    '15.589.256-2': ['Pool Entrada']                 // José Octavio Gonzales Riquelme
  },

  /** Lista de brigadas del catálogo anterior, para detectar la migración. */
  BRIGADAS_ANTERIORES: [
    'Cocina', 'Aseo general', 'Mantención', 'Lavandería',
    'Jardín y patio', 'Comedor', 'Dormitorios', 'Bodega'
  ],

  /** Deja el R.U.T. en solo dígitos + dígito verificador, para comparar. */
  claveRut(rut) {
    return String(rut || '').replace(/[^0-9kK]/g, '').toUpperCase();
  },

  /**
   * Agrega los residentes de la nómina que aún no estén registrados.
   * La comparación se hace por R.U.T., de modo que se puede repetir sin
   * generar fichas duplicadas.
   */
  cargar() {
    const existentes = new Set(
      DB.todos('residentes').map(r => NOMINA.claveRut(r.documento)).filter(Boolean)
    );

    let agregados = 0, omitidos = 0;
    NOMINA.RESIDENTES.forEach(p => {
      if (existentes.has(NOMINA.claveRut(p.rut))) { omitidos++; return; }
      DB.crear('residentes', {
        nombre: p.nombre,
        documento: p.rut,
        etapa: p.etapa,
        fechaIngreso: p.ingreso,
        brigadas: (NOMINA.ASIGNACIONES[p.rut] || []).slice(),
        estado: 'Activo'
      });
      agregados++;
    });

    DB.guardarConfig({ nominaCargada: true });
    return { agregados, omitidos };
  },

  /**
   * Deja el catálogo de brigadas del centro en la configuración, conservando
   * las que el usuario haya agregado por su cuenta.
   */
  actualizarCatalogo() {
    const actuales = DB.config.brigadas || [];
    const propias = actuales.filter(b =>
      !NOMINA.BRIGADAS.includes(b) && !NOMINA.BRIGADAS_ANTERIORES.includes(b));
    DB.guardarConfig({
      brigadas: NOMINA.BRIGADAS.concat(propias),
      brigadasColectivas: Object.assign({}, NOMINA.COLECTIVAS, DB.config.brigadasColectivas || {})
    });
  },

  /**
   * Asigna las brigadas a las fichas ya existentes, buscándolas por R.U.T.
   * No toca a quien ya tenga brigadas asignadas, para no pisar cambios
   * hechos a mano. Devuelve el detalle de lo aplicado.
   */
  aplicarBrigadas() {
    NOMINA.actualizarCatalogo();

    const porRut = {};
    Object.keys(NOMINA.ASIGNACIONES).forEach(rut => {
      porRut[NOMINA.claveRut(rut)] = NOMINA.ASIGNACIONES[rut];
    });

    let asignados = 0, conservados = 0, noEncontrados = 0;
    const vistos = new Set();

    DB.todos('residentes').forEach(r => {
      const clave = NOMINA.claveRut(r.documento);
      const brigadas = porRut[clave];
      if (!brigadas) return;
      vistos.add(clave);
      if (DB.brigadasDe(r).length) { conservados++; return; }
      DB.actualizar('residentes', r.id, { brigadas: brigadas.slice() });
      asignados++;
    });

    Object.keys(porRut).forEach(k => { if (!vistos.has(k)) noEncontrados++; });

    DB.guardarConfig({ brigadasAsignadas: true });
    return { asignados, conservados, noEncontrados };
  },

  /** Carga automática la primera vez que se usa la aplicación en un equipo. */
  autoCargar() {
    if (!DB.config.nominaCargada) {
      if (DB.todos('residentes').length) {
        // Ya hay fichas creadas a mano: no se interviene con la nómina.
        DB.guardarConfig({ nominaCargada: true });
      } else {
        NOMINA.actualizarCatalogo();
        NOMINA.cargar();
        DB.guardarConfig({ brigadasAsignadas: true });
        return;
      }
    }
    // Fichas creadas antes de que existieran las brigadas del centro:
    // se completan una sola vez.
    if (!DB.config.brigadasAsignadas) NOMINA.aplicarBrigadas();
  }
};

const Dashboard = {

  indicadores() {
    const hoy = U.hoy();
    const d7 = U.sumaDias(hoy, -7);
    const d30 = U.sumaDias(hoy, -30);
    const [mesIni, mesFin] = U.mesDe(U.mesActual());

    const activos = DB.activos();
    const presentes = DB.presentes();
    const fuera = DB.fueraDelCentro();
    const egresados = DB.egresados();

    const ingresos30 = activos.filter(r => r.fechaIngreso >= d30);
    const ingresos7 = activos.filter(r => r.fechaIngreso >= d7);
    const egresosMes = egresados.filter(r => U.enRango(r.fechaEgreso, mesIni, mesFin));

    const progresos = activos.map(r => DB.progresoEtapa(r));
    const etapaLista = progresos.filter(p => p.desfase > 0 || p.estado === 'cumplido');
    const etapaDesfasada = progresos.filter(p => p.desfase > 0);
    const etapaProxima = progresos.filter(p => p.estado === 'proximo');
    const faltas7 = DB.todos('conductas').filter(c => c.fecha >= d7);
    const faltasGraves7 = faltas7.filter(c => c.gravedad !== 'Leve');
    const llamadasHoy = U.suma(DB.todos('llamadas').filter(l => l.fecha === hoy), l => l.cantidad);
    const tareasHoy = DB.todos('tareas').filter(t => t.fecha === hoy);
    const tareasPend = DB.todos('tareas').filter(t => t.estado === 'Pendiente');

    const permanencias = activos.map(r => DB.diasEstadia(r));
    const permanenciaProm = permanencias.length
      ? Math.round(U.suma(permanencias) / permanencias.length) : 0;

    const altas = egresados.filter(r => r.tipoEgreso === 'Alta terapéutica').length;
    const tasaAlta = egresados.length ? Math.round(altas / egresados.length * 100) : null;

    const cumplimiento = Tareas.cumplimiento(DB.todos('tareas'));

    const atrasados = DB.salidasAbiertas().filter(s => DB.retornoAtrasado(s));

    return {
      hoy, d7, d30, activos, presentes, fuera, egresados, ingresos30, ingresos7,
      egresosMes, etapaLista, etapaDesfasada, etapaProxima, faltas7, faltasGraves7, llamadasHoy, tareasHoy, tareasPend,
      permanenciaProm, tasaAlta, altas, cumplimiento, atrasados
    };
  }
};

        });
        UI.toast('Residente reactivado.');
        App.pintar();
      }
    });
  },

  /* ---------- filtro del listado ---------- */

  filtrar() {
    const q = U.norm(App.f('q'));
    const etapa = App.f('etapa');
    const estado = App.f('estado', 'activos');
    const brigada = App.f('brigada');

    const [mesIni, mesFin] = U.mesDe(U.mesActual());

    return DB.todos('residentes').filter(r => {
      if (estado === 'activos' && r.estado === 'Egresado') return false;
      if (estado === 'egresados' && r.estado !== 'Egresado') return false;
      if (estado === 'presentes' && (r.estado === 'Egresado' || DB.salidaAbierta(r.id))) return false;
      if (estado === 'fuera' && !(r.estado !== 'Egresado' && DB.salidaAbierta(r.id))) return false;
      if (estado === 'ingresos30' &&
        (r.estado === 'Egresado' || r.fechaIngreso < U.sumaDias(U.hoy(), -30))) return false;
      if (estado === 'egresosMes' &&
        (r.estado !== 'Egresado' || !U.enRango(r.fechaEgreso, mesIni, mesFin))) return false;
      if (etapa && r.etapa !== etapa) return false;
      if (brigada && !DB.brigadasDe(r).includes(brigada)) return false;
      if (q) {
        const blob = U.norm([r.nombre, r.documento, r.sustancia, DB.brigadasTexto(r, ' '), r.diagnostico].join(' '));
        if (!blob.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => a.nombre.localeCompare(b.nombre));
  }
};

/* ===== progreso.js ===== */
/* ============================================================
   progreso.js — Evoluciones: avance de etapa de cada residente
   ============================================================
   Esta es la sección "Evoluciones" de la aplicación: administra
   el paso de los residentes por las etapas del programa.

   El avance lo determinan los días de tratamiento (ver DB.DURACIONES):
     Compromiso ....... 15 días   (días 0 a 14)
     Grupo 4 .......... 45 días   (días 15 a 59)
     Grupo 3 .......... 45 días   (días 60 a 104)
     Grupo 2 .......... 45 días   (días 105 a 149)
     Grupo 1 .......... 30 días   (días 150 a 179)
     Nivel 1 .......... 60 días   (días 180 a 239, 2 meses)
     Nivel 2 .......... 60 días   (días 240 a 299, 2 meses)
   A los 300 días (10 meses) termina la escalera obligatoria.
   Nivel 3 es optativo: reinserción laboral desde los 10 meses o
   reinserción social desde los 11 meses. Los cargos posteriores
   los decide el equipo, no el calendario.
   ============================================================ */

const Progreso = {

  ESTADOS: {
    'cumplido': { cls: 'b-danger', l: 'Plazo cumplido' },
    'proximo': { cls: 'b-warn', l: 'Próximo a progresar' },
    'optativa': { cls: 'b-info', l: 'Puede optar' },
    'en-curso': { cls: 'b-ok', l: 'En curso' },
    'sin-plazo': { cls: 'b-gray', l: 'Sin plazo definido' }
  },

  badge(p) {
    // En una etapa optativa lo informativo es la modalidad, no el plazo.
    if (p.enOptativa) {
      return `<span class="badge b-info">${U.esc(p.modalidad || 'Etapa optativa')}</span>`;
    }
    const e = Progreso.ESTADOS[p.estado] || Progreso.ESTADOS['sin-plazo'];
    const l = p.estado === 'optativa' && p.siguiente ? `Puede optar a ${p.siguiente}` : e.l;
    return `<span class="badge ${e.cls}">${U.esc(l)}</span>`;
  },

  /** Residentes activos ordenados por urgencia: primero los desfasados. */
  lista() {
    return DB.activos()
      .map(r => ({ r, p: DB.progresoEtapa(r) }))
      .sort((a, b) => {
        // Un desfase (el tiempo indica una etapa más avanzada) va primero.
        if ((a.p.desfase > 0) !== (b.p.desfase > 0)) return a.p.desfase > 0 ? -1 : 1;
        if (a.p.desfase > 0 && b.p.desfase > 0) return b.p.desfase - a.p.desfase;
        const orden = { 'cumplido': 0, 'proximo': 1, 'optativa': 2, 'en-curso': 3, 'sin-plazo': 4 };
        const d = orden[a.p.estado] - orden[b.p.estado];
        if (d !== 0) return d;
        if (a.p.requerido && b.p.requerido) return a.p.restante - b.p.restante;
        return a.r.nombre.localeCompare(b.r.nombre);
      });
  },

  /** Residentes cuya etapa registrada quedó por detrás del tiempo cumplido. */
  desfasados() {
    return Progreso.lista().filter(x => x.p.desfase > 0);
  },

  /** ¿Ya cumple el tiempo para optar a la etapa optativa siguiente? */
  puedeOptar(p) {
    return !!p.optativa &&
      (p.estado === 'optativa' || p.optativa.opciones.some(o => o.disponible));
  },

  /** Residentes que ya pueden optar a Nivel 3 y todavía no lo han tomado. */
  habilitadosOptativa(lista) {
    return (lista || Progreso.lista()).filter(x => Progreso.puedeOptar(x.p));
  },

  /** Texto de las modalidades de una etapa optativa. */
  textoOptativa(p) {
    if (!p.optativa) return '';
    return p.optativa.opciones.map(o => o.disponible
      ? `${o.v}: disponible`
      : `${o.v}: ${U.fecha(o.fecha)}`).join(' · ');
  },

  /* ---------- ajuste por tiempo de tratamiento ---------- */

  /**
   * Sube al residente hasta la etapa que le corresponde por sus días de
   * tratamiento, dejando registrada cada etapa intermedia con la fecha en
   * que la cumplió. Devuelve cuántos cambios se registraron.
   */
  ajustarUno(residenteId, registradoPor) {
    let r = DB.residente(residenteId);
    if (!r) return 0;
    const p = DB.progresoEtapa(r);
    if (p.desfase <= 0) return 0;

    const hasta = DB.ETAPAS.indexOf(p.corresponde);
    let n = 0;
    for (let i = DB.ETAPAS.indexOf(r.etapa) + 1; i <= hasta; i++) {
      const etapa = DB.ETAPAS[i];
      const previstos = DB.inicioPrevisto(etapa);
      // La fecha del cambio es el día en que cumplió los días exigidos, sin
      // quedar nunca antes del inicio de la etapa anterior ni en el futuro.
      let fecha = U.sumaDias(r.fechaIngreso, previstos);
      const minimo = DB.etapaDesde(r);
      if (fecha < minimo) fecha = minimo;
      if (fecha > U.hoy()) fecha = U.hoy();
      Progreso.aplicarCambio(r, etapa, fecha,
        `Ajuste por tiempo de tratamiento: cumple ${previstos} días en el centro.`,
        registradoPor || '');
      r = DB.residente(residenteId);
      n++;
    }
    return n;
  },

  ajustar(residenteId) {
    const r = DB.residente(residenteId);
    if (!r) return;
    const p = DB.progresoEtapa(r);
    if (p.desfase <= 0) return UI.toast('Su etapa ya coincide con su tiempo de tratamiento.');

    UI.confirmar({
      title: 'Actualizar etapa por tiempo',
      submit: 'Actualizar',
      body: `<b>${U.esc(r.nombre)}</b> lleva <b>${p.diasTratamiento} días</b> de tratamiento.
        Según el plan del centro le corresponde <b>${U.esc(p.corresponde)}</b> y está
        registrado en <b>${U.esc(r.etapa)}</b>.<br>
        <span class="muted small">Se registrará el paso por cada etapa intermedia con la
        fecha en que cumplió los días exigidos.</span>`,
      onSubmit: () => {
        const n = Progreso.ajustarUno(r.id, (Auth.sesion() || {}).nombre);
        UI.toast(`${r.nombre}: ${U.plural(n, 'cambio registrado', 'cambios registrados')}.`);
        App.pintar();
      }
    });
  },

  ajustarTodos() {
    const pendientes = Progreso.desfasados();
    if (!pendientes.length) return UI.toast('Todas las etapas coinciden con el tiempo de tratamiento.');

    UI.confirmar({
      title: 'Actualizar etapas por tiempo de tratamiento',
      submit: `Actualizar ${pendientes.length}`,
      body: `Se actualizará la etapa de <b>${U.plural(pendientes.length, 'residente', 'residentes')}</b>
        según los días que llevan en el centro:
        <div class="pre small" style="margin-top:9px;max-height:220px;overflow:auto">${
          pendientes.map(x => `${U.esc(x.r.nombre)} · ${x.p.diasTratamiento} días · ${U.esc(x.r.etapa)} → ${U.esc(x.p.corresponde)}`).join('\n')
        }</div>
        <div class="small muted" style="margin-top:9px">Queda registrado el paso por cada etapa
        intermedia. Los residentes con cargo o nivel por sobre lo que indica el tiempo no se tocan.</div>`,
      onSubmit: () => {
        const quien = (Auth.sesion() || {}).nombre;
        let n = 0;
        pendientes.forEach(x => { n += Progreso.ajustarUno(x.r.id, quien); });
        UI.toast(`${pendientes.length} residentes actualizados · ${n} cambios registrados.`);
        App.pintar();
      }
    });
  },

  /** Cambios de etapa registrados para un residente dentro de un período.
   *  Se usa en los informes: sin fechas, devuelve el historial completo. */
  cambiosEn(residenteId, desde, hasta) {
    return DB.de('etapas', residenteId)
      .filter(h => U.enRango(h.desde, desde, hasta))
      .sort((a, b) => String(a.desde).localeCompare(String(b.desde)));
  },

  /* ---------- registro de cambio de etapa ---------- */

  /**
   * Deja constancia del cambio de etapa: cierra el tramo anterior en el
   * historial, abre el nuevo y actualiza la ficha del residente.
   */
  aplicarCambio(r, nuevaEtapa, fecha, motivo, registradoPor, modalidad) {
    const historial = DB.de('etapas', r.id);

    // Si la ficha no tenía historial, se deja registrado el tramo actual
    // para no perder desde cuándo estaba en su etapa anterior.
    if (!historial.length && r.etapa) {
      DB.crear('etapas', {
        residenteId: r.id,
        etapa: r.etapa,
        desde: DB.etapaDesde(r),
        hasta: fecha,
        motivo: '',
        registradoPor: ''
      });
    } else {
      const abierto = historial.find(h => !h.hasta);
      if (abierto) DB.actualizar('etapas', abierto.id, { hasta: fecha });
    }

    DB.crear('etapas', {
      residenteId: r.id,
      etapa: nuevaEtapa,
      desde: fecha,
      hasta: '',
      motivo: motivo || '',
      registradoPor: registradoPor || '',
      modalidad: modalidad || ''
    });

    // La modalidad solo acompaña a las etapas optativas (Nivel 3).
    DB.actualizar('residentes', r.id, {
      etapa: nuevaEtapa,
      etapaDesde: fecha,
      modalidad: DB.esOptativa(nuevaEtapa) ? (modalidad || '') : ''
    });
  },

  cambiarEtapa(residenteId) {
    const r = DB.residente(residenteId);
    if (!r) return;
    const p = DB.progresoEtapa(r);
    const sugerida = p.siguiente || r.etapa;

    UI.modal({
      title: 'Registrar cambio de etapa',
      sub: `${r.nombre} · actualmente en ${r.etapa}`,
      submit: 'Registrar cambio',
      body: `
        <div class="note" style="margin-bottom:14px">
          Lleva <b>${p.diasTratamiento} días</b> de tratamiento y <b>${p.dias} días</b>
          en ${U.esc(r.etapa)}${p.requerido ? ` de los ${p.requerido} previstos` : ' (etapa sin plazo definido)'}.
          ${p.siguiente ? `La etapa siguiente es <b>${U.esc(p.siguiente)}</b>.` : 'Es la última etapa del programa.'}
        </div>
        ${p.optativa ? `<div class="note warn" style="margin-bottom:14px">
          <b>${U.esc(p.optativa.etapa)} es optativo.</b> Modalidades:
          ${p.optativa.opciones.map(o => `<br>· ${U.esc(o.v)} — desde los ${o.meses} meses (${o.dias} días): ${
            o.disponible ? `<b>disponible</b> desde el ${U.fecha(o.fecha)}`
              : `disponible el ${U.fecha(o.fecha)}, en ${U.plural(o.restante, 'día', 'días')}`}`).join('')}
          <br><span class="small">Si elige esta etapa, indique la modalidad.</span>
        </div>` : ''}
        ${UI.campos([
          { n: 'etapa', l: 'Nueva etapa', t: 'select', w: 7, req: true, opts: DB.ETAPAS, vacio: false, val: sugerida },
          { n: 'fecha', l: 'Fecha del cambio', t: 'date', w: 5, req: true, val: U.hoy() },
          {
            n: 'modalidad', l: 'Modalidad de reinserción', t: 'select', w: 12,
            opts: (DB.OPTATIVAS['Nivel 3'].opciones || []).map(o => o.v),
            val: r.modalidad || '',
            help: 'Solo para Nivel 3: laboral desde los 10 meses, social desde los 11 meses.'
          },
          { n: 'motivo', l: 'Motivo o acuerdo del equipo', t: 'textarea', w: 12, rows: 3,
            ph: 'Cumplimiento del plazo, evaluación del equipo, retroceso por falta grave…' },
          { n: 'registradoPor', l: 'Registrado por', t: 'text', w: 12, val: DB.config.responsable }
        ], {})}`,
      onSubmit: d => {
        if (d.etapa === r.etapa) {
          UI.toast('Seleccione una etapa distinta a la actual.', 'err');
          return false;
        }
        if (d.fecha < DB.etapaDesde(r)) {
          UI.toast('La fecha del cambio no puede ser anterior al inicio de la etapa actual.', 'err');
          return false;
        }
        if (DB.esOptativa(d.etapa) && !d.modalidad) {
          UI.toast(`Indique la modalidad de ${d.etapa}: reinserción laboral o social.`, 'err');
          return false;
        }
        const retrocede = DB.ETAPAS.indexOf(d.etapa) < DB.ETAPAS.indexOf(r.etapa);
        Progreso.aplicarCambio(r, d.etapa, d.fecha, d.motivo, d.registradoPor, d.modalidad);

        // El equipo puede adelantar una reinserción, pero queda advertido.
        const opcion = DB.opcionesOptativas(r, d.etapa).find(o => o.v === d.modalidad);
        if (opcion && !opcion.disponible) {
          UI.toast(`Registrado. Atención: ${opcion.v} se cumple a los ${opcion.meses} meses (${U.fecha(opcion.fecha)}).`, 'warn');
        } else {
          UI.toast(`${r.nombre}: ${retrocede ? 'retroceso' : 'progresión'} a ${d.etapa}.`);
        }
        App.pintar();
      }
    });
  },

  /** Corrige desde cuándo el residente está en su etapa actual. */
  corregirInicio(residenteId) {
    const r = DB.residente(residenteId);
    if (!r) return;
    UI.modal({
      title: 'Corregir inicio de etapa',
      sub: `${r.nombre} · ${r.etapa}`,
      size: 'narrow',
      submit: 'Guardar',
      body: `
        <div class="note" style="margin-bottom:14px">
          Indique desde cuándo está en <b>${U.esc(r.etapa)}</b>. El sistema usa esta fecha
          para calcular el avance; si no se ha registrado, toma la fecha de ingreso.
        </div>
        ${UI.campos([
          { n: 'etapaDesde', l: 'En esta etapa desde', t: 'date', w: 12, req: true, val: DB.etapaDesde(r) }
        ], {})}`,
      onSubmit: d => {
        if (d.etapaDesde < r.fechaIngreso) {
          UI.toast('No puede ser anterior a la fecha de ingreso.', 'err');
          return false;
        }
        if (d.etapaDesde > U.hoy()) {
          UI.toast('No puede ser una fecha futura.', 'err');
          return false;
        }
        DB.actualizar('residentes', r.id, { etapaDesde: d.etapaDesde });
        const abierto = DB.de('etapas', r.id).find(h => !h.hasta);
        if (abierto) DB.actualizar('etapas', abierto.id, { desde: d.etapaDesde });
        UI.toast('Inicio de etapa actualizado.');
        App.pintar();
      }
    });
  },

  /* ---------- línea de tiempo ---------- */

  /** Escalera completa del programa con el punto en que va el residente. */
  timeline(r) {
    const historial = DB.historialEtapas(r);
    const cumplidas = {};
    historial.forEach(h => {
      cumplidas[h.etapa] = cumplidas[h.etapa] || h;
    });
    const p = DB.progresoEtapa(r);
    const iActual = DB.ETAPAS.indexOf(r.etapa);

    return `<div class="tl-etapas">${DB.ETAPAS.map((etapa, i) => {
      const esActual = i === iActual;
      const pasada = i < iActual;
      const h = cumplidas[etapa];
      const dur = DB.DURACIONES[etapa];

      let detalle;
      if (esActual) {
        detalle = `<b>${p.dias} ${p.dias === 1 ? 'día' : 'días'}</b>` +
          (p.requerido ? ` de ${p.requerido} · previsto ${U.fecha(p.fechaPrevista)}` : ' · sin plazo definido') +
          (p.modalidad ? ` · ${U.esc(p.modalidad)}` : '');
      } else if (DB.esOptativa(etapa) && !h) {
        // Etapa optativa: se indica desde cuándo puede tomarse cada modalidad.
        detalle = 'Optativa · ' + DB.opcionesOptativas(r, etapa).map(o =>
          `${o.v} desde los ${o.meses} meses (${U.fecha(o.fecha)})`).join(' · ');
      } else if (h) {
        detalle = h.hasta
          ? `${U.fecha(h.desde)} → ${U.fecha(h.hasta)} (${U.dias(h.desde, h.hasta)} días)`
          : `desde ${U.fecha(h.desde)}`;
      } else if (pasada) {
        detalle = dur ? `${dur} días` : 'sin plazo definido';
      } else {
        // Etapa por venir: se indica cuándo la alcanza según su fecha de ingreso.
        const prevista = U.sumaDias(r.fechaIngreso, DB.inicioPrevisto(etapa));
        detalle = dur
          ? `${dur} días · desde el día ${DB.inicioPrevisto(etapa)} de tratamiento (${U.fecha(prevista)})`
          : 'sin plazo definido · por evaluación del equipo';
      }

      return `<div class="tl-etapa ${esActual ? 'actual' : pasada ? 'pasada' : 'futura'}">
        <div class="tl-punto"></div>
        <div style="min-width:0">
          <div class="tl-nombre">${U.esc(etapa)}</div>
          <div class="tl-detalle">${detalle}</div>
          ${esActual && p.requerido ? `
            <div class="bar-track" style="margin-top:6px;max-width:220px">
              <div class="bar-fill" style="width:${p.porcentaje}%;background:${
                p.estado === 'cumplido' ? 'var(--danger)' : p.estado === 'proximo' ? 'var(--warn)' : 'var(--primary)'
              }"></div>
            </div>` : ''}
        </div>
      </div>`;
    }).join('')}</div>`;
  },

  /* ---------- panel principal ---------- */

  panel() {
    const lista = Progreso.lista();
    const q = U.norm(App.f('q'));
    const filtroEstado = App.f('estadoEtapa');

    const filtrada = lista.filter(x => {
      if (filtroEstado === 'desfasado') { if (x.p.desfase <= 0) return false; }
      else if (filtroEstado === 'optativa') { if (!Progreso.puedeOptar(x.p)) return false; }
      else if (filtroEstado && x.p.estado !== filtroEstado) return false;
      if (q && !U.norm(x.r.nombre + ' ' + x.r.etapa).includes(q)) return false;
      return true;
    });

    const cuenta = e => lista.filter(x => x.p.estado === e).length;
    const desfasados = lista.filter(x => x.p.desfase > 0).length;

    const resumen = `<div class="grid g4" style="margin-bottom:16px">
      ${UI.stat({
        ico: '⏱️', val: desfasados, lab: 'Etapa por actualizar',
        nota: 'El tiempo indica una etapa más avanzada',
        color: desfasados ? 'var(--danger-soft)' : 'var(--ok-soft)',
        accion: desfasados ? 'ajustar-etapas' : ''
      })}
      ${UI.stat({ ico: '⬆️', val: cuenta('cumplido'), lab: 'Con plazo cumplido', nota: 'Corresponde evaluar el cambio' })}
      ${UI.stat({ ico: '📅', val: cuenta('proximo'), lab: 'Próximos a progresar', nota: `En los siguientes ${DB.DIAS_AVISO_ETAPA} días` })}
      ${UI.stat({
        ico: '🤝', val: Progreso.habilitadosOptativa(lista).length, lab: 'Pueden optar a Nivel 3',
        nota: 'Reinserción laboral (10 meses) o social (11)'
      })}
    </div>`;

    const toolbar = App.toolbar([
      App.buscador('Buscar residente…'),
      App.selectFiltro('estadoEtapa', 'Todos los estados', [
        { v: 'desfasado', l: 'Etapa por actualizar' },
        { v: 'cumplido', l: 'Plazo cumplido' },
        { v: 'proximo', l: 'Próximos a progresar' },
        { v: 'optativa', l: 'Pueden optar a Nivel 3' },
        { v: 'en-curso', l: 'En curso' },
        { v: 'sin-plazo', l: 'Sin plazo definido' }
      ]),
      desfasados ? `<button class="btn btn-primary" data-action="ajustar-etapas">⏱️ Actualizar ${desfasados} por tiempo</button>` : '',
      `<div class="spacer"></div>`,
      `<div class="small faint">${U.plural(filtrada.length, 'residente', 'residentes')}</div>`
    ]);

    const tabla = UI.tabla([
      {
        l: 'Residente', c: x => `<div style="font-weight:600">${U.esc(x.r.nombre)}</div>
          <div class="small faint">Ingreso ${U.fecha(x.r.fechaIngreso)} · ${x.p.diasTratamiento} días de tratamiento</div>`
      },
      {
        l: 'Etapa registrada', c: x => App.badgeEtapa(x.r.etapa) +
          (x.p.modalidad ? `<div class="small faint">${U.esc(x.p.modalidad)}</div>` : '')
      },
      {
        l: 'Corresponde por tiempo', c: x => {
          if (x.p.desfase > 0) {
            return `<span class="badge b-danger">${U.esc(x.p.corresponde)}</span>
              <div class="small faint">Debe subir ${U.plural(x.p.desfase, 'etapa', 'etapas')}</div>`;
          }
          if (x.p.alDia) {
            return `<span class="faint">${U.esc(x.p.corresponde)}</span>
              <div class="small faint">Coincide</div>`;
          }
          // Pasados los 180 días el tiempo ya no manda: avanza por evaluación.
          return x.p.diasTratamiento >= DB.PLAN_TOTAL
            ? `<span class="faint">—</span>
               <div class="small faint">Completó los ${DB.PLAN_TOTAL} días del plan</div>`
            : `<span class="faint">${U.esc(x.p.corresponde)}</span>
               <div class="small faint">Va por delante del plan</div>`;
        }
      },
      {
        l: 'Tiempo en la etapa', c: x => {
          const pie = x.p.estimada
            ? `<div class="small faint" title="Fecha deducida del plan del centro">Desde ${U.fecha(x.p.desde)} (estimado)</div>`
            : `<div class="small faint">Desde ${U.fecha(x.p.desde)}</div>`;
          if (!x.p.requerido) return `<div>${x.p.dias} días</div>${pie}`;
          return `<div>${x.p.dias} de ${x.p.requerido} días</div>
            <div class="bar-track" style="margin-top:4px;max-width:150px">
              <div class="bar-fill" style="width:${x.p.porcentaje}%;background:${
                x.p.estado === 'cumplido' ? 'var(--danger)' : x.p.estado === 'proximo' ? 'var(--warn)' : 'var(--primary)'
              }"></div>
            </div>${pie}`;
        }
      },
      {
        l: 'Próxima etapa', c: x => {
          if (!x.p.siguiente) return '<span class="faint">Última etapa</span>';
          if (x.p.optativa) {
            // Nivel 3: no lo impone el calendario, se ofrece por modalidad.
            return `<div>${U.esc(x.p.siguiente)} <span class="badge b-gray">optativa</span></div>` +
              x.p.optativa.opciones.map(o => `<div class="small ${o.disponible ? '' : 'faint'}">
                ${o.disponible ? '✓' : '·'} ${U.esc(o.v)} · ${o.disponible
                  ? 'disponible' : U.fecha(o.fecha)}</div>`).join('');
          }
          return `<div>${U.esc(x.p.siguiente)}</div>${x.p.requerido
            ? `<div class="small faint">${x.p.restante > 0
              ? U.fecha(x.p.fechaPrevista) + ' · en ' + U.plural(x.p.restante, 'día', 'días')
              : x.p.restante === 0 ? 'plazo cumplido hoy'
                : 'plazo cumplido hace ' + U.plural(-x.p.restante, 'día', 'días')}</div>`
            : ''}`;
        }
      },
      { l: 'Estado', cls: 'nowrap', c: x => Progreso.badge(x.p) },
      {
        l: '', cls: 'actions', c: x => `
          <button class="btn btn-sm btn-ghost" data-action="ver-timeline" data-id="${x.r.id}" title="Ver línea de tiempo">📈</button>
          <button class="btn btn-sm btn-ghost" data-action="corregir-inicio" data-id="${x.r.id}" title="Corregir inicio de etapa">📅</button>
          ${x.p.desfase > 0
            ? `<button class="btn btn-sm btn-primary" data-action="ajustar-etapa" data-id="${x.r.id}"
                       title="Subirlo a la etapa que le corresponde por tiempo">⏱️ Actualizar</button>`
            : `<button class="btn btn-sm ${['cumplido', 'proximo', 'optativa'].includes(x.p.estado) ? 'btn-primary' : ''}"
                       data-action="cambiar-etapa" data-id="${x.r.id}">⬆ Cambiar etapa</button>`}`
      }
    ], filtrada, {
      vacio: {
        ico: '📈', titulo: 'Sin residentes que mostrar',
        texto: 'Ajuste los filtros para ver el avance de etapa.'
      }
    });

    const nota = `
      <div class="note" style="margin-bottom:16px">
        <b>La etapa la determinan los días de tratamiento:</b>
        Compromiso los días 0 a 14 (15 días) · Grupo 4 del 15 al 59 · Grupo 3 del 60 al 104 ·
        Grupo 2 del 105 al 149 (45 días cada uno, 1,5 meses) · Grupo 1 del 150 al 179 (30 días) ·
        Nivel 1 del 180 al 239 y Nivel 2 del 240 al 299 (2 meses cada uno).
        A los 300 días (10 meses) termina la escalera con plazos.
        <b>Nivel 3 es optativo</b>: reinserción laboral desde los 10 meses (300 días) o
        reinserción social desde los 11 (330 días); se toma por decisión del residente y del
        equipo, y los cargos posteriores también.
        <br><span class="small">Cuando la etapa registrada queda por detrás del tiempo cumplido,
        el residente aparece como <b>etapa por actualizar</b>. El botón <b>⏱️ Actualizar</b>
        lo sube a la que le corresponde y deja registrada cada etapa intermedia con la fecha
        en que la cumplió. Si progresó antes o después de lo previsto, corrija la fecha real
        con el botón 📅.</span>
      </div>`;

    return nota + resumen + toolbar +
      `<div class="card"><div class="card-body tight">${tabla}</div></div>`;
  },

  verTimeline(id) {
    const r = DB.residente(id);
    if (!r) return;
    const p = DB.progresoEtapa(r);
    UI.modal({
      title: 'Línea de tiempo del tratamiento',
      sub: r.nombre,
      submit: null,
      cancel: 'Cerrar',
      body: `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
          ${App.badgeEtapa(r.etapa)} ${Progreso.badge(p)}
          ${p.modalidad ? `<span class="badge b-info">${U.esc(p.modalidad)}</span>` : ''}
          <span class="badge b-gray">${p.diasTratamiento} días · ${DB.meses(p.diasTratamiento)} meses</span>
          <span class="badge b-gray">Ingreso ${U.fecha(r.fechaIngreso)}</span>
        </div>
        ${p.optativa && p.optativa.opciones.some(o => o.disponible) ? `
          <div class="note" style="margin-bottom:14px">
            Ya cumple el tiempo para optar a <b>${U.esc(p.optativa.etapa)}</b>:
            ${p.optativa.opciones.filter(o => o.disponible).map(o => U.esc(o.v)).join(' o ')}.
          </div>` : ''}
        ${p.desfase > 0 ? `<div class="note warn" style="margin-bottom:14px">
          Por sus días de tratamiento le corresponde <b>${U.esc(p.corresponde)}</b> y está
          registrado en <b>${U.esc(r.etapa)}</b>.</div>` : ''}
        ${Progreso.timeline(r)}`,
      extraFoot: `<button type="button" class="btn btn-sm btn-primary"
        data-action="cambiar-etapa" data-id="${r.id}">⬆ Cambiar etapa</button>`
    });
  }
};

/* ============================================================
   Vista "Evoluciones": progreso de etapa de los residentes
   ============================================================ */

Vistas['evoluciones'] = {
  titulo: 'Evoluciones',
  sub: () => {
    const l = Progreso.lista();
    const cumplidos = l.filter(x => x.p.estado === 'cumplido').length;
    const proximos = l.filter(x => x.p.estado === 'proximo').length;
    return `Progreso de etapa de ${l.length} residentes · ${cumplidos} con plazo cumplido · ${proximos} próximos a progresar`;
  },
  acciones: () => {
    const n = Progreso.desfasados().length;
    return `<button class="btn" data-action="exportar-progreso">⬇ Exportar CSV</button>` +

/* ============================================================
   conducta.js — registro de faltas, incidentes y medidas
   ============================================================ */

const Conducta = {

  ESTADOS: ['Abierto', 'En seguimiento', 'Resuelto'],

  /** Formulario completo, usado al editar un registro existente. */
  campos(c) {
    return UI.campos([
      { n: 'residenteId', l: 'Residente', t: 'select', w: 12, req: true, opts: App.opcionesResidentes(true) },
      { n: 'fecha', l: 'Fecha del hecho', t: 'date', w: 4, req: true, val: U.hoy() },
      { n: 'hora', l: 'Hora', t: 'time', w: 3, val: U.ahora() },
      { n: 'gravedad', l: 'Gravedad', t: 'select', w: 5, req: true, opts: DB.GRAVEDADES, val: 'Leve' },
      { n: 'tipoFalta', l: 'Tipo de falta o incidente', t: 'select', w: 7, req: true, opts: DB.TIPOS_FALTA },
      { n: 'lugar', l: 'Lugar', t: 'text', w: 5, ph: 'Comedor, dormitorio, patio…' },
      { n: 'descripcion', l: 'Descripción del hecho', t: 'textarea', w: 12, rows: 4, req: true,
        ph: 'Relate objetivamente lo ocurrido: qué, cuándo, quiénes participaron y consecuencias.' },
      { n: 'testigos', l: 'Testigos o involucrados', t: 'text', w: 12 },

      { t: 'sep', l: 'Medida aplicada y seguimiento' },
      { n: 'medida', l: 'Medida', t: 'select', w: 6, opts: DB.MEDIDAS },
      { n: 'estado', l: 'Estado del caso', t: 'select', w: 6, opts: Conducta.ESTADOS, val: 'Abierto', vacio: false },
      { n: 'medidaDetalle', l: 'Detalle de la medida / plazo', t: 'textarea', w: 12, rows: 2 },
      { n: 'seguimiento', l: 'Seguimiento y resultado', t: 'textarea', w: 12, rows: 2 },
      { n: 'reportadoPor', l: 'Reportado por', t: 'text', w: 12, val: DB.config.responsable }
    ], c || {});
  },

  /**
   * Registro rápido: solo lo indispensable. El resto de los datos queda
   * plegado y se puede completar después al editar o al cerrar el caso.
   */
  nueva(rid) {
    UI.modal({
      title: 'Registrar falta o incidente',
      sub: rid ? DB.nombreDe(rid) : 'Registro conductual',
      submit: 'Registrar',
      body: `
        ${UI.campos([
          { n: 'residenteId', l: 'Residente', t: 'select', w: 12, req: true, opts: App.opcionesResidentes(false) },
          { n: 'gravedad', l: 'Gravedad', t: 'select', w: 5, req: true, opts: DB.GRAVEDADES, val: 'Leve', vacio: false },
          { n: 'tipoFalta', l: 'Tipo', t: 'select', w: 7, req: true, opts: DB.TIPOS_FALTA },
          { n: 'descripcion', l: 'Qué ocurrió', t: 'textarea', w: 12, rows: 3, req: true,
            ph: 'Breve relato del hecho.' }
        ], { residenteId: rid || '' })}

        <details class="detalles-opcionales">
          <summary>Agregar más detalles (opcional)</summary>
          ${UI.campos([
            { n: 'fecha', l: 'Fecha del hecho', t: 'date', w: 6, val: U.hoy() },
            { n: 'hora', l: 'Hora', t: 'time', w: 6, val: U.ahora() },
            { n: 'lugar', l: 'Lugar', t: 'text', w: 12, ph: 'Comedor, dormitorio, patio…' },
            { n: 'medida', l: 'Medida aplicada', t: 'select', w: 12, opts: DB.MEDIDAS },
            { n: 'reportadoPor', l: 'Reportado por', t: 'text', w: 12, val: DB.config.responsable }
          ], {})}
        </details>`,
      onSubmit: d => {
        d.fecha = d.fecha || U.hoy();
        d.estado = 'Abierto';
        DB.crear('conductas', d);
        UI.toast('Falta registrada.');
        App.pintar();
      }
    });
  },

  editar(id) {
    const c = DB.obtener('conductas', id);
    if (!c) return;
    UI.modal({
      title: 'Editar registro conductual',
      sub: DB.nombreDe(c.residenteId) + ' · ' + U.fecha(c.fecha),
      size: 'wide',
      body: Conducta.campos(c),
      onSubmit: d => {
        // Si se marca resuelto desde el formulario se deja la fecha de cierre,
        // que es lo que usa el informe del residente.
        if (d.estado === 'Resuelto' && !c.fechaResolucion) d.fechaResolucion = U.hoy();
        if (d.estado !== 'Resuelto') d.fechaResolucion = '';
        DB.actualizar('conductas', id, d);
        UI.toast('Registro actualizado.');
        App.pintar();
      }
    });
  },

  /* ---------- resolución de casos ---------- */

  resolver(id) {
    const c = DB.obtener('conductas', id);
    if (!c) return;
    UI.modal({
      title: 'Cerrar caso como resuelto',
      sub: `${DB.nombreDe(c.residenteId)} · ${U.esc(c.tipoFalta)} del ${U.fecha(c.fecha)}`,
      submit: 'Marcar como resuelto',
      body: `
        <div class="note" style="margin-bottom:14px">
          Al cerrar el caso queda registrado como <b>resuelto</b> y se incorpora al
          informe personal del residente, en la sección de faltas resueltas.
        </div>
        ${UI.campos([
          { n: 'fechaResolucion', l: 'Fecha de resolución', t: 'date', w: 6, req: true, val: U.hoy() },
          { n: 'resueltoPor', l: 'Cerrado por', t: 'text', w: 6, val: DB.config.responsable },
          {
            n: 'resolucion', l: 'Resultado del caso', t: 'textarea', w: 12, rows: 4, req: true,
            ph: 'Cómo se resolvió: cumplimiento de la medida, reparación, acuerdos alcanzados, actitud del residente…'
          }
        ], c)}`,
      onSubmit: d => {
        if (d.fechaResolucion < c.fecha) {
          UI.toast('La resolución no puede ser anterior al hecho.', 'err');
          return false;
        }
        DB.actualizar('conductas', id, Object.assign({ estado: 'Resuelto' }, d));
        UI.toast('Caso cerrado. Ya aparece en el informe del residente.');
        App.pintar();
      }
    });
  },

  reabrir(id) {
    const c = DB.obtener('conductas', id);
    if (!c) return;
    UI.confirmar({
      title: 'Reabrir caso',
      body: `¿Reabrir el caso de <b>${U.esc(DB.nombreDe(c.residenteId))}</b>
        (${U.esc(c.tipoFalta)}, ${U.fecha(c.fecha)})?<br>
        <span class="muted small">Volverá al estado «En seguimiento» y dejará de figurar
        como resuelto en los informes. Se conserva lo escrito en el resultado.</span>`,
      submit: 'Reabrir',
      onSubmit: () => {
        DB.actualizar('conductas', id, { estado: 'En seguimiento', fechaResolucion: '' });
        UI.toast('Caso reabierto.');
        App.pintar();
      }
    });
  },

  /** Faltas de un residente cerradas dentro del período indicado. */
  resueltasEn(residenteId, desde, hasta) {
    return DB.de('conductas', residenteId)
      .filter(c => c.estado === 'Resuelto' && c.fechaResolucion &&
        U.enRango(c.fechaResolucion, desde, hasta))
      .sort((a, b) => String(a.fechaResolucion).localeCompare(String(b.fechaResolucion)));
  },

  filtrar(base) {
    const q = U.norm(App.f('q'));
    const rid = App.f('residente'), grav = App.f('gravedad'), est = App.f('estado');
    const desde = App.f('desde'), hasta = App.f('hasta');
    return (base || DB.todos('conductas')).filter(c => {
      if (rid && c.residenteId !== rid) return false;
      if (grav && c.gravedad !== grav) return false;
      if (est && (c.estado || 'Abierto') !== est) return false;
      if (!U.enRango(c.fecha, desde, hasta)) return false;
      if (q) {
        const blob = U.norm([DB.nombreDe(c.residenteId), c.tipoFalta, c.descripcion, c.medida, c.lugar, c.reportadoPor].join(' '));
        if (!blob.includes(q)) return false;
      }
      return true;
    }).sort(U.porFechaDesc());
  },

  badgeEstado(e) {
    const cls = { 'Abierto': 'b-danger', 'En seguimiento': 'b-warn', 'Resuelto': 'b-ok' }[e || 'Abierto'];
    return `<span class="badge ${cls}">${U.esc(e || 'Abierto')}</span>`;
  },

  tabla(filas, opts) {
    opts = opts || {};
    const cols = [
      { l: 'Fecha', cls: 'nowrap', c: c => `<div>${U.fecha(c.fecha)}</div><div class="small faint">${U.esc(c.hora || '')}</div>` }
    ];
    if (!opts.sinResidente) cols.push({ l: 'Residente', c: c => App.enlaceResidente(c.residenteId) });
    cols.push(
      { l: 'Gravedad', cls: 'nowrap', c: c => App.badgeGravedad(c.gravedad) },
      { l: 'Tipo', c: c => U.esc(c.tipoFalta) },
      { l: 'Descripción', c: c => U.esc(U.corta(c.descripcion, 120)) },
      { l: 'Medida', c: c => c.medida ? U.esc(c.medida) : '<span class="faint">Sin medida</span>' },
      {
        l: 'Estado', cls: 'nowrap', c: c => Conducta.badgeEstado(c.estado) +
          (c.estado === 'Resuelto' && c.fechaResolucion
            ? `<div class="small faint">${U.fecha(c.fechaResolucion)}</div>` : '')
      },
      {
        l: '', cls: 'actions', c: c =>
          (c.estado === 'Resuelto'
            ? `<button class="btn btn-sm btn-ghost" data-action="reabrir-conducta" data-id="${c.id}" title="Reabrir caso">↺</button> `
            : `<button class="btn btn-sm btn-primary" data-action="resolver-conducta" data-id="${c.id}">✓ Resolver</button> `) +
          `<button class="btn btn-sm btn-ghost" data-action="ver-conducta" data-id="${c.id}" title="Ver detalle">👁</button>` +
          App.accionesFila('conductas', c.id, 'el registro del ' + U.fecha(c.fecha))
      }
    );
    return UI.tabla(cols, filas, {
      vacio: {
        ico: '✅', titulo: 'Sin faltas ni incidentes registrados',
        texto: 'Aquí se registran incumplimientos, incidentes y las medidas aplicadas.',
        accion: `<button class="btn btn-primary" data-action="nueva-conducta" ${opts.rid ? `data-rid="${opts.rid}"` : ''}>+ Registrar falta</button>`
      }
    });
  },

  ver(id) {
    const c = DB.obtener('conductas', id);
    if (!c) return;
    UI.modal({
      title: c.tipoFalta || 'Registro conductual',
      sub: DB.nombreDe(c.residenteId) + ' · ' + U.fechaHora(c.fecha, c.hora),
      submit: null,
      cancel: 'Cerrar',
      body: `
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">
          ${App.badgeGravedad(c.gravedad)} ${Conducta.badgeEstado(c.estado)}
          ${c.lugar ? `<span class="badge b-gray">${U.esc(c.lugar)}</span>` : ''}
        </div>
        <div class="section-title" style="margin-top:0">Descripción del hecho</div>
        <div class="pre">${U.nl(c.descripcion)}</div>
        ${c.testigos ? `<div class="section-title">Testigos / involucrados</div><div class="pre">${U.nl(c.testigos)}</div>` : ''}
        <div class="section-title">Medida aplicada</div>
        <div class="pre">${U.esc(c.medida || 'Sin medida registrada')}${c.medidaDetalle ? '\n' + U.esc(c.medidaDetalle) : ''}</div>
        ${c.seguimiento ? `<div class="section-title">Seguimiento</div><div class="pre">${U.nl(c.seguimiento)}</div>` : ''}
        ${c.estado === 'Resuelto' && c.resolucion ? `
          <div class="section-title">Resultado del caso</div>
          <div class="note" style="margin-top:4px">
            <div class="pre">${U.nl(c.resolucion)}</div>
            <div class="small muted" style="margin-top:6px">
              Cerrado el ${U.fecha(c.fechaResolucion)}${c.resueltoPor ? ' por ' + U.esc(c.resueltoPor) : ''}.
            </div>
          </div>` : ''}
        ${c.brigada ? `<div class="section-title">Brigada</div>
          <div class="small muted">${U.esc(c.brigada)}</div>` : ''}
        <div class="section-title">Reportado por</div>
        <div class="small muted">${U.esc(c.reportadoPor) || 'No indicado'}</div>`,
      extraFoot: (c.estado === 'Resuelto'
        ? ''
        : `<button type="button" class="btn btn-sm btn-primary" data-action="resolver-conducta" data-id="${c.id}">✓ Resolver</button> `) +
        `<button type="button" class="btn btn-sm" data-action="editar-conductas" data-id="${c.id}">✏️ Editar</button>`
    });
  },

  panel(r) {
    const filas = DB.de('conductas', r.id).sort(U.porFechaDesc());
    const ult30 = DB.faltasRecientes(r.id, 30);
    const peso = U.suma(ult30, f => DB.pesoFalta(f.gravedad));
    return `
      ${ult30.length >= Alertas.FALTAS_REINCIDENCIA ? `<div class="note danger" style="margin-bottom:16px">
        <b>Alerta de reincidencia:</b> ${ult30.length} faltas en los últimos 30 días
        (puntaje de gravedad ${peso}). Se sugiere evaluación por el equipo técnico.
      </div>` : ''}
      <div class="card">
        <div class="card-head">
          <div><h3>Conducta</h3><div class="sub">Faltas, incidentes y medidas aplicadas</div></div>
          <div class="right">
            <button class="btn btn-primary btn-sm" data-action="nueva-conducta" data-rid="${r.id}">+ Registrar falta</button>
          </div>
        </div>
        <div class="card-body tight">${Conducta.tabla(filas, { sinResidente: true, rid: r.id })}</div>
      </div>`;
  }
};

Vistas['conducta'] = {
  titulo: 'Conducta',
  sub: () => {
    const t = DB.todos('conductas');
    const abiertos = t.filter(c => (c.estado || 'Abierto') !== 'Resuelto').length;
    const desde = U.sumaDias(U.hoy(), -7);

  render() {

      body: UI.campos([
        { n: 'fechaRetorno', l: 'Fecha de retorno', t: 'date', w: 6, req: true, val: U.hoy() },
        { n: 'horaRetorno', l: 'Hora de retorno', t: 'time', w: 6, val: U.ahora() },
        { n: 'condicionRetorno', l: 'Condición en que retorna', t: 'select', w: 12, req: true, opts: Salidas.CONDICIONES, val: Salidas.CONDICIONES[0] },
        { n: 'recibidoPor', l: 'Recibido por', t: 'text', w: 12, val: DB.config.responsable },
        { n: 'observacionesRetorno', l: 'Observaciones del retorno', t: 'textarea', w: 12, rows: 3 }
      ], s),
      onSubmit: d => {
        if (d.fechaRetorno < s.fechaSalida) {
          UI.toast('El retorno no puede ser anterior a la salida.', 'err');
          return false;
        }
        DB.actualizar('salidas', id, d);
        UI.toast('Retorno registrado.');
        if (d.condicionRetorno === 'Con signos de consumo') {
          UI.toast('Considere registrar el hecho en el módulo de Conducta.', 'warn');
        }
        App.pintar();
      }
    });
  },

  filtrar(base) {
    const q = U.norm(App.f('q'));
    const rid = App.f('residente'), tipo = App.f('tipo'), est = App.f('estadoSalida');
    const desde = App.f('desde'), hasta = App.f('hasta');
    return (base || DB.todos('salidas')).filter(s => {
      if (rid && s.residenteId !== rid) return false;
      if (tipo && s.tipo !== tipo) return false;
      if (est === 'fuera' && s.fechaRetorno) return false;
      if (est === 'retornados' && !s.fechaRetorno) return false;
      if (est === 'atrasados' && !DB.retornoAtrasado(s)) return false;
      if (!U.enRango(s.fechaSalida, desde, hasta)) return false;
      if (q) {
        const blob = U.norm([DB.nombreDe(s.residenteId), s.tipo, s.destino, s.acompanante, s.observaciones, s.autorizadoPor].join(' '));
        if (!blob.includes(q)) return false;
      }
      return true;
    }).sort(U.porFechaDesc('fechaSalida'));
  },

  badgeEstado(s) {
    const e = DB.estadoSalida(s);
    const cls = { 'Retornado': 'b-ok', 'Fuera del centro': 'b-warn', 'Atrasado': 'b-danger' }[e];
    return `<span class="badge ${cls}">${e}</span>`;
  },

  duracion(s) {
    if (!s.fechaRetorno) return '—';
    const d = U.dias(s.fechaSalida, s.fechaRetorno);
    return d === 0 ? 'Mismo día' : U.plural(d, 'día', 'días');
  },

  tabla(filas, opts) {
    opts = opts || {};
    const cols = [
      { l: 'Salida', cls: 'nowrap', c: s => `<div>${U.fecha(s.fechaSalida)}</div><div class="small faint">${U.esc(s.horaSalida || '')}</div>` }
    ];
    if (!opts.sinResidente) cols.push({ l: 'Residente', c: s => App.enlaceResidente(s.residenteId) });
    cols.push(
      { l: 'Motivo', c: s => `<div>${U.esc(s.tipo)}</div>${s.destino ? `<div class="small faint">${U.esc(s.destino)}</div>` : ''}` },
      {
        l: 'Retorno previsto', cls: 'nowrap',
        c: s => `<div>${U.fecha(s.fechaRetornoPrev)}</div><div class="small faint">${U.esc(s.horaRetornoPrev || '')}</div>`
      },
      {
        l: 'Retorno real', cls: 'nowrap',
        c: s => s.fechaRetorno
          ? `<div>${U.fecha(s.fechaRetorno)}</div><div class="small faint">${U.esc(s.horaRetorno || '')}</div>`
          : '<span class="faint">Pendiente</span>'
      },
      { l: 'Duración', cls: 'nowrap', c: s => Salidas.duracion(s) },
      {
        l: 'Estado', cls: 'nowrap', c: s => Salidas.badgeEstado(s) +
          (s.condicionRetorno && s.condicionRetorno !== Salidas.CONDICIONES[0]
            ? `<div class="small" style="color:var(--danger)">${U.esc(s.condicionRetorno)}</div>` : '')
      },
      {
        l: '', cls: 'actions', c: s =>
          (!s.fechaRetorno
            ? `<button class="btn btn-sm btn-primary" data-action="registrar-retorno" data-id="${s.id}">↩ Retorno</button> `
            : '') + App.accionesFila('salidas', s.id, 'la salida del ' + U.fecha(s.fechaSalida))
      }
    );
    return UI.tabla(cols, filas, {
      vacio: {
        ico: '🚪', titulo: 'Sin salidas registradas',
        texto: 'Registre aquí cada salida del centro y su correspondiente retorno.',
        accion: `<button class="btn btn-primary" data-action="nueva-salida" ${opts.rid ? `data-rid="${opts.rid}"` : ''}>+ Registrar salida</button>`
      }
    });
  },

  panel(r) {
    const filas = DB.de('salidas', r.id).sort(U.porFechaDesc('fechaSalida'));
    const abierta = DB.salidaAbierta(r.id);
    return `
      ${abierta ? `<div class="note ${DB.retornoAtrasado(abierta) ? 'danger' : 'warn'}" style="margin-bottom:16px">
        <b>${DB.retornoAtrasado(abierta) ? 'Retorno atrasado.' : 'Actualmente fuera del centro.'}</b>
        Salió el ${U.fechaHora(abierta.fechaSalida, abierta.horaSalida)} por "${U.esc(abierta.tipo)}".
        Retorno previsto: ${U.fechaHora(abierta.fechaRetornoPrev, abierta.horaRetornoPrev)}.
        <button class="btn btn-sm btn-primary" style="margin-left:8px" data-action="registrar-retorno" data-id="${abierta.id}">Registrar retorno</button>
      </div>` : ''}
      <div class="card">
        <div class="card-head">
          <div><h3>Salidas y retornos</h3><div class="sub">Control de permisos y reingresos al centro</div></div>
          <div class="right">
            ${!abierta ? `<button class="btn btn-primary btn-sm" data-action="nueva-salida" data-rid="${r.id}">+ Registrar salida</button>` : ''}
          </div>
        </div>
        <div class="card-body tight">${Salidas.tabla(filas, { sinResidente: true, rid: r.id })}</div>
      </div>`;
  }
};

const Llamadas = {

  campos(l) {
    return UI.campos([
      { n: 'residenteId', l: 'Residente', t: 'select', w: 12, req: true, opts: App.opcionesResidentes(false) },
      { n: 'fecha', l: 'Fecha', t: 'date', w: 4, req: true, val: U.hoy() },
      { n: 'cantidad', l: 'Cantidad de llamadas', t: 'number', w: 4, req: true, min: 1, max: 50, val: 1 },
      { n: 'duracion', l: 'Duración total (min)', t: 'number', w: 4, min: 0, max: 600 },
      { n: 'destinatarios', l: 'Persona(s) contactada(s)', t: 'text', w: 7, ph: 'Nombre y parentesco' },
      { n: 'hora', l: 'Hora (primera llamada)', t: 'time', w: 5, val: U.ahora() },
      { n: 'autorizadoPor', l: 'Supervisado / autorizado por', t: 'text', w: 12, val: DB.config.responsable },
      { n: 'observaciones', l: 'Observaciones', t: 'textarea', w: 12, rows: 2,
        ph: 'Estado emocional posterior, temas relevantes, incidencias…' }
    ], l || {});
  },

  nueva(rid, fecha) {
    UI.modal({
      title: 'Registrar llamadas',
      sub: rid ? DB.nombreDe(rid) : 'Registro telefónico del día',
      submit: 'Registrar',
      body: Llamadas.campos({ residenteId: rid || '', fecha: fecha || U.hoy() }),
      onSubmit: d => {
        d.cantidad = Number(d.cantidad) || 1;
        const max = Number(DB.config.maxLlamadasDia) || 0;
        const yaHechas = DB.llamadasDelDia(d.residenteId, d.fecha);
        DB.crear('llamadas', d);
        if (max > 0 && yaHechas + d.cantidad > max) {
          UI.toast(`Atención: ${DB.nombreDe(d.residenteId)} acumula ${yaHechas + d.cantidad} llamadas ese día (máximo ${max}).`, 'warn');
        } else {
          UI.toast('Llamadas registradas.');
        }
        App.pintar();
      }
    });
  },

  editar(id) {
    const l = DB.obtener('llamadas', id);
    if (!l) return;
    UI.modal({
      title: 'Editar registro de llamadas',
      sub: DB.nombreDe(l.residenteId) + ' · ' + U.fecha(l.fecha),
      body: Llamadas.campos(l),
      onSubmit: d => {
        d.cantidad = Number(d.cantidad) || 1;
        DB.actualizar('llamadas', id, d);
        UI.toast('Registro actualizado.');
        App.pintar();
      }
    });
  },

  filtrar(base) {
    const q = U.norm(App.f('q'));
    const rid = App.f('residente');
    const desde = App.f('desde'), hasta = App.f('hasta');
    return (base || DB.todos('llamadas')).filter(l => {
      if (rid && l.residenteId !== rid) return false;
      if (!U.enRango(l.fecha, desde, hasta)) return false;
      if (q) {
        const blob = U.norm([DB.nombreDe(l.residenteId), l.destinatarios, l.observaciones, l.autorizadoPor].join(' '));
        if (!blob.includes(q)) return false;
      }
      return true;
    }).sort(U.porFechaDesc());
  },

  tabla(filas, opts) {
    opts = opts || {};
    const max = Number(DB.config.maxLlamadasDia) || 0;
    const cols = [
      { l: 'Fecha', cls: 'nowrap', c: l => `<div>${U.fecha(l.fecha)}</div><div class="small faint">${U.esc(l.hora || '')}</div>` }
    ];
    if (!opts.sinResidente) cols.push({ l: 'Residente', c: l => App.enlaceResidente(l.residenteId) });
    cols.push(
      {
        l: 'Llamadas', cls: 'nowrap', c: l => {
          const total = DB.llamadasDelDia(l.residenteId, l.fecha);
          const excede = max > 0 && total > max;
          return `<span class="badge ${excede ? 'b-danger' : 'b-info'}">${l.cantidad || 1}</span>` +
            (excede ? `<div class="small" style="color:var(--danger)">${total} ese día</div>` : '');
        }
      },
      { l: 'Duración', cls: 'nowrap', c: l => l.duracion ? l.duracion + ' min' : '<span class="faint">—</span>' },
      { l: 'Contactó a', c: l => U.esc(l.destinatarios) || '<span class="faint">No registrado</span>' },
      { l: 'Observaciones', c: l => U.esc(U.corta(l.observaciones, 90)) || '<span class="faint">—</span>' },
      { l: 'Supervisó', c: l => U.esc(l.autorizadoPor) || '<span class="faint">—</span>' },
      { l: '', cls: 'actions', c: l => App.accionesFila('llamadas', l.id, 'el registro del ' + U.fecha(l.fecha)) }
    );
    return UI.tabla(cols, filas, {
      vacio: {
        ico: '📞', titulo: 'Sin llamadas registradas',
        texto: 'Registre la cantidad de llamadas que realiza cada residente por día.',
        accion: `<button class="btn btn-primary" data-action="nueva-llamada" ${opts.rid ? `data-rid="${opts.rid}"` : ''}>+ Registrar llamadas</button>`
      }
    });
  },

  /** Resumen del día: cuántas llamadas lleva cada residente activo hoy. */
  resumenDia(fecha) {
    return DB.activos().map(r => ({
      r,
      total: DB.llamadasDelDia(r.id, fecha)
    })).sort((a, b) => b.total - a.total || a.r.nombre.localeCompare(b.r.nombre));
  },

  panel(r) {
    const filas = DB.de('llamadas', r.id).sort(U.porFechaDesc());
    const total = U.suma(filas, l => l.cantidad);
    const dias = new Set(filas.map(l => l.fecha)).size;
    const hoy = DB.llamadasDelDia(r.id, U.hoy());
    const max = Number(DB.config.maxLlamadasDia) || 0;
    return `
      <div class="grid g3" style="margin-bottom:16px">
        ${UI.stat({ ico: '📞', val: total, lab: 'Llamadas acumuladas' })}
        ${UI.stat({ ico: '📅', val: dias, lab: 'Días con llamadas', nota: dias ? `Promedio ${(total / dias).toFixed(1)} por día` : '' })}
        ${UI.stat({ ico: '☎️', val: hoy, lab: 'Llamadas hoy', nota: max ? `Máximo permitido: ${max}` : '' })}
      </div>
      <div class="card">
        <div class="card-head">
          <div><h3>Registro de llamadas</h3><div class="sub">Cantidad de llamadas realizadas por día</div></div>
          <div class="right">
            <button class="btn btn-primary btn-sm" data-action="nueva-llamada" data-rid="${r.id}">+ Registrar llamadas</button>
          </div>
        </div>
        <div class="card-body tight">${Llamadas.tabla(filas, { sinResidente: true, rid: r.id })}</div>
      </div>`;
  }
};

      `<input type="date" data-filtro="hasta" value="${U.esc(App.f('hasta'))}" title="Hasta">`,
      `<div class="spacer"></div>`,
      `<div class="small faint">${U.plural(filas.length, 'registro', 'registros')} · ${U.suma(filas, l => l.cantidad)} llamadas</div>`
    ]);

    return panelDia + toolbar + `<div class="card"><div class="card-body tight">${Llamadas.tabla(filas)}</div></div>`;
  }
};

      sub: rid ? DB.nombreDe(rid) : 'Registro de tareas de brigada',
      size: 'wide',
      submit: 'Guardar tarea',
      body: Tareas.campos({
        residenteId: rid || '',
        brigada: rid ? (DB.brigadasDe(DB.residente(rid))[0] || '') : ''
      }),
      onSubmit: d => {
        DB.crear('tareas', d);
        UI.toast('Tarea registrada.');
        App.pintar();
      }
    });
  },

  editar(id) {
    const t = DB.obtener('tareas', id);
    if (!t) return;
    UI.modal({
      title: 'Editar tarea',
      sub: DB.nombreDe(t.residenteId) + ' · ' + U.fecha(t.fecha),
      size: 'wide',
      body: Tareas.campos(t),
      onSubmit: d => {
        DB.actualizar('tareas', id, d);
        UI.toast('Tarea actualizada.');
        App.pintar();
      }
    });
  },

  evaluar(id) {
    const t = DB.obtener('tareas', id);
    if (!t) return;
    UI.modal({
      title: 'Evaluar cumplimiento',
      sub: `${DB.nombreDe(t.residenteId)} · ${U.corta(t.tarea, 60)}`,
      submit: 'Guardar evaluación',
      body: UI.campos([
        { n: 'estado', l: 'Estado', t: 'select', w: 6, req: true, opts: DB.ESTADOS_TAREA, vacio: false, val: 'Cumplida' },
        { n: 'evaluacion', l: 'Evaluación', t: 'select', w: 6, opts: DB.EVALUACIONES },
        { n: 'supervisor', l: 'Evaluada por', t: 'text', w: 12, val: DB.config.responsable },
        { n: 'observaciones', l: 'Observaciones', t: 'textarea', w: 12, rows: 3 }
      ], t),
      onSubmit: d => {
        DB.actualizar('tareas', id, d);
        UI.toast('Evaluación registrada.');
        App.pintar();
      }
    });
  },

  /* ---------- incumplimiento de brigada ---------- */

  /** Residentes a los que se puede imputar el incumplimiento de una brigada. */
  candidatos(brigada) {
    const encargados = DB.residentesDeBrigada(brigada);
    if (encargados.length) return { lista: encargados, preseleccion: encargados.map(r => r.id) };

    // Brigadas sin encargado individual (Exterior, Huerto, Leña): se ofrecen
    // los residentes del grupo a cargo, sin preseleccionar a nadie.
    const colectiva = DB.brigadaColectiva(brigada);
    if (colectiva === 'Niveles') {
      const niveles = DB.activos().filter(r => /^Nivel /.test(r.etapa || ''));
      if (niveles.length) return { lista: niveles, preseleccion: [], colectiva };
    }
    return { lista: DB.activos(), preseleccion: [], colectiva };
  },

  /** Faltas por incumplimiento registradas para una brigada. */
  incumplimientos(brigada, dias) {
    const desde = dias ? U.sumaDias(U.hoy(), -dias) : '';
    return DB.todos('conductas')
      .filter(c => c.brigada === brigada && (!desde || c.fecha >= desde));
  },

  informarIncumplimiento(brigada) {
    const { lista, preseleccion, colectiva } = Tareas.candidatos(brigada);
    if (!lista.length) return UI.toast('No hay residentes activos a quienes registrar la falta.', 'err');

    UI.modal({
      title: 'Informar incumplimiento de brigada',
      sub: brigada + (colectiva ? ` · a cargo de ${colectiva}` : ''),
      size: 'wide',
      submit: 'Registrar falta grave',
      body: `
        <div class="note warn" style="margin-bottom:15px">
          El incumplimiento se registrará en <b>Conducta</b> como
          <b>falta grave</b> del tipo «Incumplimiento de tareas», una por cada
          residente seleccionado.
          ${colectiva ? `<br>Esta brigada no tiene encargado individual: está a cargo
            de los <b>${U.esc(colectiva)}</b>, por lo que debe indicar a quiénes corresponde.` : ''}
        </div>
        ${UI.campos([
          {
            n: 'residentes', l: 'Residentes responsables', t: 'checks', w: 12,
            opts: lista.map(r => ({ v: r.id, l: `${r.nombre} (${r.etapa})` })),
            val: preseleccion,
            help: 'Se creará un registro de conducta por cada residente marcado.'
          },
          { n: 'fecha', l: 'Fecha del incumplimiento', t: 'date', w: 4, req: true, val: U.hoy() },
          { n: 'hora', l: 'Hora', t: 'time', w: 3, val: U.ahora() },
          { n: 'lugar', l: 'Lugar', t: 'text', w: 5, val: brigada },
          {
            n: 'descripcion', l: 'Descripción del incumplimiento', t: 'textarea', w: 12, rows: 4, req: true,
            ph: `Detalle qué no se cumplió en la brigada ${brigada}: tarea pendiente, estado del sector, reiteración…`
          },
          { n: 'medida', l: 'Medida aplicada', t: 'select', w: 6, opts: DB.MEDIDAS },
          { n: 'reportadoPor', l: 'Informado por', t: 'text', w: 6, val: DB.config.responsable }
        ], {})}`,
      onSubmit: d => {
        const ids = Array.isArray(d.residentes) ? d.residentes : [];
        if (!ids.length) {
          UI.toast('Seleccione al menos un residente responsable.', 'err');
          return false;
        }
        ids.forEach(rid => DB.crear('conductas', {
          residenteId: rid,
          fecha: d.fecha,
          hora: d.hora,
          gravedad: 'Grave',
          tipoFalta: 'Incumplimiento de tareas',
          lugar: d.lugar,
          brigada: brigada,
          origen: 'Brigada',
          descripcion: d.descripcion,
          medida: d.medida,
          medidaDetalle: '',
          estado: 'Abierto',
          seguimiento: '',
          reportadoPor: d.reportadoPor
        }));
        UI.toast(`Falta grave registrada para ${U.plural(ids.length, 'residente', 'residentes')}.`);
        App.pintar();
      }
    });
  },

  filtrar(base) {
    const q = U.norm(App.f('q'));
    const rid = App.f('residente'), brig = App.f('brigada'), est = App.f('estado');
    const desde = App.f('desde'), hasta = App.f('hasta');
    return (base || DB.todos('tareas')).filter(t => {
      if (rid && t.residenteId !== rid && t.delegadoA !== rid) return false;
      if (brig && t.brigada !== brig) return false;
      if (est && t.estado !== est) return false;
      if (!U.enRango(t.fecha, desde, hasta)) return false;
      if (q) {
        const blob = U.norm([DB.nombreDe(t.residenteId), t.tarea, t.brigada, t.observaciones, t.supervisor].join(' '));
        if (!blob.includes(q)) return false;
      }
      return true;
    }).sort(U.porFechaDesc());
  },

  /** Porcentaje de cumplimiento de un conjunto de tareas (excluye pendientes). */
  cumplimiento(tareas) {
    const evaluadas = tareas.filter(t => t.estado && t.estado !== 'Pendiente');
    if (!evaluadas.length) return null;
    const puntos = U.suma(evaluadas, t =>
      t.estado === 'Cumplida' ? 1 : t.estado === 'Cumplida parcialmente' ? 0.5 : 0);
    return Math.round(puntos / evaluadas.length * 100);
  },

  tabla(filas, opts) {
    opts = opts || {};
    const cols = [
      { l: 'Fecha', cls: 'nowrap', c: t => `<div>${U.fecha(t.fecha)}</div><div class="small faint">${U.esc(t.turno || '')}</div>` }
    ];
    if (!opts.sinResidente) cols.push({ l: 'Responsable', c: t => App.enlaceResidente(t.residenteId) });
    cols.push(
      { l: 'Brigada', c: t => t.brigada ? `<span class="badge b-gray">${U.esc(t.brigada)}</span>` : '<span class="faint">—</span>' },
      {
        l: 'Tarea', c: t => `<div>${U.esc(U.corta(t.tarea, 110))}</div>` +
          (t.delegadoA ? `<div class="small" style="color:var(--purple)">↪ Delegada a ${U.esc(DB.nombreDe(t.delegadoA))}</div>` : '')
      },
      { l: 'Modalidad', c: t => U.esc(t.tipo) || '<span class="faint">—</span>' },
      { l: 'Estado', cls: 'nowrap', c: t => App.badgeEstadoTarea(t.estado) },
      {
        l: 'Evaluación', cls: 'nowrap', c: t => {
          if (!t.evaluacion) return '<span class="faint">—</span>';
          const cls = { 'Excelente': 'b-ok', 'Buena': 'b-ok', 'Regular': 'b-warn', 'Deficiente': 'b-danger' }[t.evaluacion];
          return `<span class="badge ${cls}">${U.esc(t.evaluacion)}</span>`;
        }
      },
      {
        l: '', cls: 'actions', c: t =>
          (t.estado === 'Pendiente'
            ? `<button class="btn btn-sm btn-primary" data-action="evaluar-tarea" data-id="${t.id}">✓ Evaluar</button> `
            : `<button class="btn btn-sm btn-ghost" data-action="evaluar-tarea" data-id="${t.id}" title="Reevaluar">✓</button>`) +
          App.accionesFila('tareas', t.id, 'la tarea del ' + U.fecha(t.fecha))
      }
    );
    return UI.tabla(cols, filas, {
      vacio: {
        ico: '🧹', titulo: 'Sin tareas registradas',
        texto: 'Asigne tareas y responsabilidades de brigada y registre su cumplimiento.',
        accion: `<button class="btn btn-primary" data-action="nueva-tarea" ${opts.rid ? `data-rid="${opts.rid}"` : ''}>+ Asignar tarea</button>`
      }
    });
  },

  panel(r) {
    const propias = DB.todos('tareas').filter(t => t.residenteId === r.id || t.delegadoA === r.id)
      .sort(U.porFechaDesc());
    const cump = Tareas.cumplimiento(propias.filter(t => t.residenteId === r.id));
    const pendientes = propias.filter(t => t.estado === 'Pendiente').length;
    const delegadas = propias.filter(t => t.residenteId === r.id && t.delegadoA).length;

    return `
      <div class="grid g4" style="margin-bottom:16px">
        ${UI.stat({ ico: '🧹', val: propias.length, lab: 'Tareas registradas' })}
        ${UI.stat({ ico: '📊', val: cump === null ? '—' : cump + '%', lab: 'Cumplimiento', nota: cump === null ? 'Sin tareas evaluadas' : '' })}
        ${UI.stat({ ico: '⏳', val: pendientes, lab: 'Pendientes de evaluar' })}
        ${UI.stat({ ico: '↪', val: delegadas, lab: 'Tareas delegadas a otros' })}
      </div>
      <div class="card">
        <div class="card-head">
          <div><h3>Tareas y responsabilidades</h3>
            <div class="sub">Brigadas: ${U.esc(DB.brigadasTexto(r)) || 'sin asignar'}</div></div>
          <div class="right">
            <button class="btn btn-primary btn-sm" data-action="nueva-tarea" data-rid="${r.id}">+ Asignar tarea</button>
          </div>
        </div>
        <div class="card-body tight">${Tareas.tabla(propias, { sinResidente: true, rid: r.id })}</div>
      </div>`;
  }
};

/* ===== reportes.js ===== */
/* ============================================================
   reportes.js — informes semanales, mensuales, de egreso y generales
   ============================================================ */

const Reportes = {

  conclusiones: '',

  TIPOS: [
    { v: 'semanal', l: 'Informe semanal (por residente)' },
    { v: 'mensual', l: 'Informe mensual (por residente)' },
    { v: 'egreso', l: 'Informe de egreso (por residente)' },
    { v: 'general', l: 'Informe general del centro' }
  ],

  PERIODOS: [
    { v: 'actual', l: 'Período actual' },
    { v: 'anterior', l: 'Período anterior' },
    { v: 'personalizado', l: 'Rango personalizado' }
  ],

  /** Calcula [desde, hasta] según tipo y preset elegido. */
  rango(tipo, preset, r) {
    const hoy = U.hoy();
    if (tipo === 'egreso' && r) {
      return [r.fechaIngreso || hoy, r.fechaEgreso || hoy];
    }
    if (preset === 'personalizado') {
      return [App.f('repDesde') || U.sumaDias(hoy, -30), App.f('repHasta') || hoy];
    }
    if (tipo === 'mensual' || tipo === 'general') {
      const ym = preset === 'anterior'
        ? (() => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); })()
        : U.mesActual();
      return U.mesDe(ym);
    }
    // semanal
    const base = preset === 'anterior' ? U.sumaDias(hoy, -7) : hoy;
    return U.semanaDe(base);
  },

  datos(rid, desde, hasta) {
    const enR = f => U.enRango(f, desde, hasta);
    return {
      etapas: DB.de('etapas', rid).filter(h => enR(h.desde)).sort((a, b) => String(a.desde).localeCompare(String(b.desde))),
      conductas: DB.de('conductas', rid).filter(c => enR(c.fecha)).sort((a, b) => a.fecha.localeCompare(b.fecha)),
      salidas: DB.de('salidas', rid).filter(s => enR(s.fechaSalida)).sort((a, b) => a.fechaSalida.localeCompare(b.fechaSalida)),
      llamadas: DB.de('llamadas', rid).filter(l => enR(l.fecha)).sort((a, b) => a.fecha.localeCompare(b.fecha)),
      tareas: DB.de('tareas', rid).filter(t => enR(t.fecha)).sort((a, b) => a.fecha.localeCompare(b.fecha))
    };
  },

  /* ---------- piezas comunes ---------- */

  encabezado(titulo, subtitulo) {
    return `<div class="rep-head">
      <div class="rep-ident">
        <img class="rep-logo" src="${LOGO}" alt="">
        <div style="min-width:0">
          <div class="center-name">${U.esc(DB.config.centro)}</div>
          <h2>${U.esc(titulo)}</h2>
          <div class="small muted">${U.esc(subtitulo)}</div>
        </div>
      </div>
      <div class="small muted right">
        Emitido el ${U.fechaLarga(U.hoy())}<br>
        ${DB.config.responsable ? U.esc(DB.config.responsable) : ''}
      </div>
    </div>`;
  },

  sec(titulo, contenido) {
    return `<div class="rep-sec"><h4>${U.esc(titulo)}</h4>${contenido}</div>`;
  },

  vacioSec(txt) {
    return `<div class="small faint">${U.esc(txt)}</div>`;
  },

  firmas() {
    return `<div class="rep-sign">
      <div>Profesional responsable</div>
      <div>Dirección del centro</div>
    </div>`;
  },

  campoConclusiones() {
    return Reportes.sec('Conclusiones y recomendaciones', `
      <div contenteditable="true" id="rep-conclusiones"
        style="min-height:70px;border:1px dashed var(--border-strong);border-radius:6px;padding:10px;font-size:13px"
        data-ph="Escriba aquí las conclusiones del período…">${U.esc(Reportes.conclusiones)}</div>
      <div class="small faint no-print" style="margin-top:5px">Este campo es editable y se incluirá al imprimir.</div>`);
  },

  /* ---------- informe por residente ---------- */

  porResidente(r, tipo, desde, hasta) {

    const esEgreso = tipo === 'egreso';

        : 'Informe semanal de residente';
